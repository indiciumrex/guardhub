[project]
name = "guardhub-api"
version = "0.1.0"
description = "GuardHub API — orchestration brain (auth, projects, scans, findings, admin)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  "pyotp>=2.9",
  "cryptography>=43",
  "sentry-sdk==2.73.0",
  "arq==0.28.0",
  "aiosmtplib==5.1.2",
  "httpx==0.28.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "fakeredis>=2.26",
  "ruff>=0.8",
  "mypy>=1.13",
  "aiosmtpd==1.4.6",
]

[tool.uv]
# arq 0.28.0 declares redis<6, but GuardHub runs redis-py 8 for everything else. arq only uses
# basic commands (pipelines with WATCH, ZADD/PSETEX/scripts), and the Phase 1 integration tests run
# a real arq worker against Redis 7 with this combination. Revisit when arq widens its range.
override-dependencies = ["redis>=5.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guardhub_api"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["guardhub_api/findings/contract_gen.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "N", "SIM", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "N", "PLC0415", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["pyotp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# sentry-sdk 2.7x deprecates send_default_pii for data_collection; we set it explicitly (§9).
filterwarnings = ["ignore:The send_default_pii option is deprecated:DeprecationWarning"]
