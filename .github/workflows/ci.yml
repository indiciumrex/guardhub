# CI quality gates (GUARDHUB_STANDARDS §10). Nothing merges unless every job passes:
# lint → tests (incl. Go race detector) → secret scan → schema sync → i18n en/tr → images → real-browser E2E.
# Pipeline helpers live in ops/ci/.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # full lab (heavy apps included) on any branch, by hand
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts (schema sync + i18n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: generated types are up to date with packages/shared
        run: python packages/shared/scripts/gen_types.py --check
      - name: i18n (en + tr complete, others fall back to en)
        run: python ops/ci/check_i18n.py

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2
          detect --source /repo --config /repo/.gitleaks.toml --redact --verbose

  api:
    name: api (ruff, mypy, pytest + integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: guardhub_test, POSTGRES_USER: owner, POSTGRES_PASSWORD: ci-owner-pw }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U owner -d guardhub_test" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults:
      run: { working-directory: apps/api }
    env:
      GUARDHUB_TEST_DATABASE_URL: postgresql+asyncpg://guardhub_app:ci-app-pw@127.0.0.1:5432/guardhub_test
      GUARDHUB_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy guardhub_api
      - name: create least-privilege app role + migrate
        run: |
          PGPASSWORD=ci-owner-pw psql -h 127.0.0.1 -U owner -d guardhub_test \
            -c "CREATE ROLE guardhub_app LOGIN PASSWORD 'ci-app-pw' NOBYPASSRLS"
          MIGRATIONS_DATABASE_URL=postgresql+asyncpg://owner:ci-owner-pw@127.0.0.1:5432/guardhub_test \
            uv run alembic -c ../../ops/migrations/alembic.ini upgrade head
      - run: uv run pytest -q

  scanner:
    name: scanner (gofmt, vet, golangci-lint, race tests)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/scanner }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25", cache-dependency-path: apps/scanner/go.sum }
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: golangci-lint (pinned; newer releases need Go 1.26)
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.6.2 run ./...
      - run: go test -race ./...

  web:
    name: web (eslint, prettier, tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check .
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  images:
    name: container images build
    runs-on: ubuntu-latest
    needs: [api, scanner, web]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && python3 ops/scripts/gen_secrets.py --force
      - run: docker compose build

  accuracy:
    name: accuracy (validation lab, measured precision/recall)
    runs-on: ubuntu-latest
    needs: [scanner]
    # ~115 lab targets scanned one after another took ~45 min on the full lab
    timeout-minutes: 60
    env:
      # Pull requests measure the light lab (no heavy third-party apps, test_corpus/heavy-apps.txt)
      # and are gated against the committed scorecard; pushes to main (and manual runs) measure
      # the full lab, which is the scorecard.
      LAB_SKIP_HEAVY: ${{ github.event_name == 'pull_request' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: measure every check against test_corpus (isolated lab network)
        run: |
          git show HEAD:packages/shared/accuracy.json > "$RUNNER_TEMP/committed-accuracy.json"
          LAB_SOURCE=${GITHUB_SHA::12} bash test_corpus/run.sh
      - name: gate (light lab vs the committed scorecard)
        if: env.LAB_SKIP_HEAVY == '1'
        run: python3 ops/ci/accuracy_gate.py "$RUNNER_TEMP/committed-accuracy.json" packages/shared/accuracy.json
      - name: the committed gate file must match the full measurement
        if: env.LAB_SKIP_HEAVY != '1'
        run: |
          python3 ops/ci/accuracy_gate.py "$RUNNER_TEMP/committed-accuracy.json" packages/shared/accuracy.json
          git diff --stat -- packages/shared/accuracy.json
          git diff --exit-code -- packages/shared/accuracy.json || {
            echo "packages/shared/accuracy.json is stale: before merging, run the full lab on the branch (workflow_dispatch) and commit that run's accuracy-scorecards artifact"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # a light run's files cover fewer targets: never commit them as the scorecard
          name: ${{ env.LAB_SKIP_HEAVY == '1' && 'accuracy-light-not-a-scorecard' || 'accuracy-scorecards' }}
          path: |
            docs/accuracy
            packages/shared/accuracy.json
          retention-days: 30

  header-truth:
    name: header-truth (independent oracles vs header_quality, cookie_depth, exposed_files, js_libraries, content_signals, js_secrets manifests)
    runs-on: ubuntu-latest
    needs: [scanner]
    timeout-minutes: 45
    env:
      # heavy apps only on pushes to main / manual runs (pull requests: SKIPPED in the summary)
      LAB_SKIP_HEAVY: ${{ github.event_name == 'pull_request' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml==6.0.2
      # Mozilla HTTP Observatory + Google CSP Evaluator on every site target; the heavy
      # third-party apps one at a time (start, measure, remove). Fails when a manifest's
      # header_quality expectations differ from the oracle, or a target cannot be read.
      - name: oracle on every target, compared with the manifests
        run: bash test_corpus/oracles/headers/run.sh oracle-out
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: header-truth, path: oracle-out, retention-days: 30 }

  dns-truth:
    name: dns-truth (independent oracle vs dns_depth manifests)
    runs-on: ubuntu-latest
    needs: [scanner]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # BIND dig/delv, OpenSSL and curl on every site target's DNS (test_corpus/oracles/dns).
      # Fails when a manifest's dns_depth expectations differ from the oracle.
      - name: oracle on every target, compared with the manifests
        run: bash test_corpus/oracles/dns/run.sh dns-oracle-out
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: dns-truth, path: dns-oracle-out, retention-days: 30 }

  e2e:
    name: e2e (real browser, full stack + demo target)
    runs-on: ubuntu-latest
    needs: [api, scanner, web]
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.demo.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: e2e/package-lock.json }
      - name: throwaway secrets (CI only) + start the stack with the local demo target
        run: |
          cp .env.example .env && python3 ops/scripts/gen_secrets.py --force --demo
          $COMPOSE up -d --build
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/api/v1/health | grep -q '"status":"ok"' && break
            sleep 5
          done
          curl -fsS http://localhost:3000/api/v1/health
      - name: playwright
        working-directory: e2e
        run: |
          npm ci
          npx tsc -p .
          npx prettier --check .
          npx playwright install --with-deps chromium
          npx playwright test
      - name: web runtime hygiene (read-only root, Next cache writable, no unhandled errors)
        run: |
          $COMPOSE exec -T web sh -c 'touch /app/apps/web/.next/cache/.w && rm /app/apps/web/.next/cache/.w'
          ! $COMPOSE exec -T web sh -c 'touch /app/apps/web/.next/.w' 2>/dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:3000/_next/image?url=%2Ffavicon.ico&w=64&q=75')
          echo "/_next/image -> $code"; test "$code" != 200
          sleep 2
          if $COMPOSE logs --no-color web | grep -E 'ENOENT|EROFS|unhandledRejection|uncaughtException'; then
            echo "web logged unhandled filesystem/runtime errors"; exit 1
          fi
      - name: stack logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail 300
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: e2e/playwright-report, retention-days: 7 }

  # Gate M (ADR-0008 §9): the active checks, through the production active path (`scanner
  # activelab`), on DVWA, Juice Shop, WebGoat and passive targets as false-positive controls,
  # compared with OWASP ZAP 2.17.0 (pinned by digest). Lab only (*.lab.test, isolated network):
  # active modules stay OFF in production whatever this measures. Heavy apps: main + manual only.
  active-lab:
    name: active-lab (Gate M, ZAP oracle; lab only, modules stay off)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [scanner]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # the committed scorecards' source must be an ancestor of HEAD
      - name: measure the active checks on the lab and compare with ZAP
        run: LAB_SOURCE=${GITHUB_SHA::12} bash test_corpus/active/run.sh active-out
      - name: the committed active scorecards must match the measurement
        # Every number must be identical. Only the source label may differ (a branch run is
        # committed, then merged): it must name a commit this one descends from.
        run: |
          committed=$(git show HEAD:docs/accuracy-active/scorecard.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["source"])')
          git merge-base --is-ancestor "$committed" HEAD || {
            echo "docs/accuracy-active names source $committed, which HEAD does not descend from"; exit 1; }
          sed -i "s/${GITHUB_SHA::12}/$committed/g" docs/accuracy-active/*
          git status --porcelain -- docs/accuracy-active
          test -z "$(git status --porcelain -- docs/accuracy-active)" || {
            git diff -- docs/accuracy-active | head -60
            echo "docs/accuracy-active is stale: commit this run's active-lab artifact"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-lab
          path: |
            active-out
            docs/accuracy-active
          retention-days: 30

  # CD, CI half (ADR-0009). Only a push to main, and only after EVERY gate above passed: build the
  # production images, push them to GHCR, sign each digest keyless (GitHub OIDC). The server's CD
  # agent (ops/deploy/cd.sh) deploys only digests signed by this job for the commit it deploys.
  release:
    name: release (signed images to GHCR, main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [contracts, secrets, api, scanner, web, images, accuracy, header-truth, dns-truth, e2e, active-lab]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: log in to GHCR with the job's own short-lived token
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: build, push and sign api, scanner, web
        run: bash ops/ci/release_images.sh
      - name: log out
        if: always()
        run: docker logout ghcr.io
      - uses: actions/upload-artifact@v4
        with: { name: release-digests, path: release-digests.txt, retention-days: 90 }
