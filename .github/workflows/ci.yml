# CI quality gates (GUARDHUB_STANDARDS §10). Nothing merges unless every job passes:
# lint → tests (incl. Go race detector) → secret scan → schema sync → i18n en/tr → images → real-browser E2E.
# Pipeline helpers live in ops/ci/.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts (schema sync + i18n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: generated types are up to date with packages/shared
        run: python packages/shared/scripts/gen_types.py --check
      - name: i18n (en + tr complete, others fall back to en)
        run: python ops/ci/check_i18n.py

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2
          detect --source /repo --config /repo/.gitleaks.toml --redact --verbose

  api:
    name: api (ruff, mypy, pytest + integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: guardhub_test, POSTGRES_USER: owner, POSTGRES_PASSWORD: ci-owner-pw }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U owner -d guardhub_test" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults:
      run: { working-directory: apps/api }
    env:
      GUARDHUB_TEST_DATABASE_URL: postgresql+asyncpg://guardhub_app:ci-app-pw@127.0.0.1:5432/guardhub_test
      GUARDHUB_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy guardhub_api
      - name: create least-privilege app role + migrate
        run: |
          PGPASSWORD=ci-owner-pw psql -h 127.0.0.1 -U owner -d guardhub_test \
            -c "CREATE ROLE guardhub_app LOGIN PASSWORD 'ci-app-pw' NOBYPASSRLS"
          MIGRATIONS_DATABASE_URL=postgresql+asyncpg://owner:ci-owner-pw@127.0.0.1:5432/guardhub_test \
            uv run alembic -c ../../ops/migrations/alembic.ini upgrade head
      - run: uv run pytest -q

  scanner:
    name: scanner (gofmt, vet, golangci-lint, race tests)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/scanner }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25", cache-dependency-path: apps/scanner/go.sum }
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: golangci-lint (pinned; newer releases need Go 1.26)
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.6.2 run ./...
      - run: go test -race ./...

  web:
    name: web (eslint, prettier, tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check .
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  images:
    name: container images build
    runs-on: ubuntu-latest
    needs: [api, scanner, web]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && python3 ops/scripts/gen_secrets.py --force
      - run: docker compose build

  accuracy:
    name: accuracy (validation lab, measured precision/recall)
    runs-on: ubuntu-latest
    needs: [scanner]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: measure every check against test_corpus (isolated lab network)
        run: LAB_SOURCE=${GITHUB_SHA::12} bash test_corpus/run.sh
      - name: the committed gate file must match the measurement
        run: |
          git diff --stat -- packages/shared/accuracy.json
          git diff --exit-code -- packages/shared/accuracy.json || {
            echo "packages/shared/accuracy.json is stale: run 'bash test_corpus/run.sh' and commit the result"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: accuracy-scorecards, path: docs/accuracy, retention-days: 30 }

  e2e:
    name: e2e (real browser, full stack + demo target)
    runs-on: ubuntu-latest
    needs: [api, scanner, web]
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.demo.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: e2e/package-lock.json }
      - name: throwaway secrets (CI only) + start the stack with the local demo target
        run: |
          cp .env.example .env && python3 ops/scripts/gen_secrets.py --force --demo
          $COMPOSE up -d --build
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/api/v1/health | grep -q '"status":"ok"' && break
            sleep 5
          done
          curl -fsS http://localhost:3000/api/v1/health
      - name: playwright
        working-directory: e2e
        run: |
          npm ci
          npx tsc -p .
          npx prettier --check .
          npx playwright install --with-deps chromium
          npx playwright test
      - name: web runtime hygiene (read-only root, Next cache writable, no unhandled errors)
        run: |
          $COMPOSE exec -T web sh -c 'touch /app/apps/web/.next/cache/.w && rm /app/apps/web/.next/cache/.w'
          ! $COMPOSE exec -T web sh -c 'touch /app/apps/web/.next/.w' 2>/dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:3000/_next/image?url=%2Ffavicon.ico&w=64&q=75')
          echo "/_next/image -> $code"; test "$code" != 200
          sleep 2
          if $COMPOSE logs --no-color web | grep -E 'ENOENT|EROFS|unhandledRejection|uncaughtException'; then
            echo "web logged unhandled filesystem/runtime errors"; exit 1
          fi
      - name: stack logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail 300
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: e2e/playwright-report, retention-days: 7 }
