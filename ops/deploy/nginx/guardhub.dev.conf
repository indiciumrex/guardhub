# GuardHub (HKSolutions) - only this file belongs to GuardHub.
# Upstream: the ACTIVE blue/green colour (127.0.0.1:18701 or :18702, never 0.0.0.0), defined in
# /opt/guardhub/shared/nginx-upstream.conf and switched by ops/deploy/guardhub-ctl.sh
# (nginx -t + graceful reload: in-flight requests finish on the old colour).
# Security headers (CSP with nonce, HSTS, X-Frame-Options...) are set by the app itself.
# NOTE: no `http2` here on purpose: on nginx 1.24 it is a per-socket switch and would change
# every other site on :443.
include /opt/guardhub/shared/nginx-upstream.conf;

server {
    listen 80;
    listen [::]:80;
    server_name guardhub.dev www.guardhub.dev;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /opt/guardhub/acme; default_type text/plain; }
    location / { return 301 https://guardhub.dev$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.guardhub.dev;
    server_tokens off;
    access_log off;
    ssl_certificate /etc/letsencrypt/live/guardhub.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guardhub.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    return 301 https://guardhub.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name guardhub.dev;
    server_tokens off;
    # Scan report URLs carry ids; the app logs requests itself (without IPs in clear).
    access_log off;
    ssl_certificate /etc/letsencrypt/live/guardhub.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guardhub.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;

    location ^~ /.well-known/acme-challenge/ { root /opt/guardhub/acme; default_type text/plain; }
    # Ownership proof for GuardHub's own dogfooding self-scan (ops/scripts/self_scan.py).
    location = /.well-known/guardhub-verify.txt {
        alias /opt/guardhub/selfverify/guardhub-verify.txt;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    location / {
        proxy_pass http://guardhub_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite (never append) so clients cannot spoof their address; the API trusts
        # exactly 2 hops: this proxy + the web app's /api rewrite (TRUSTED_PROXY_HOPS=2).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
