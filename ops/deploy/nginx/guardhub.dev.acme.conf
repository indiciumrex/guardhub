# GuardHub (HKSolutions) - bootstrap vhost used ONLY until the first certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name guardhub.dev www.guardhub.dev;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /opt/guardhub/acme; default_type text/plain; }
    location / { return 404; }
}
