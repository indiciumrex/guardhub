# DELIBERATELY VULNERABLE local demo target. Never deploy this.
# Used only by docker-compose.demo.yml so GuardHub can be proven end-to-end without scanning
# anyone else's site. All "secrets" under site/ are fake.
worker_processes 1;
events { worker_connections 64; }

http {
  server_tokens on;                      # info_leak: Server header with version
  default_type text/html;
  include /etc/nginx/mime.types;

  server {
    listen 8080;
    server_name demo-target;
    root /usr/share/nginx/html;

    location / { try_files $uri $uri/ =404; }

    # exposed_env: .env / .git served as plain files
    location = /.env { default_type text/plain; try_files $uri =404; }
    location = /.git/HEAD { default_type text/plain; alias /usr/share/nginx/html/_git/HEAD; }
    location /_git/ { return 404; }
    location = /.well-known/guardhub-verify.txt { default_type text/plain; try_files $uri =404; }

    # info_leak: directory listing
    location /files/ { autoindex on; }

    # info_leak: framework version header
    add_header X-Powered-By "Express 4.17.1" always;

    # security_headers: an insecure session cookie on the home page
    location = /index.html { add_header Set-Cookie "session=demo123; Path=/" always; add_header X-Powered-By "Express 4.17.1" always; }
  }
}
