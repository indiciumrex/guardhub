target: dvwa
origin: http://dvwa.lab.test
active: true
sessions: dvwa-session.json # written by test_corpus/active/login-dvwa.sh (lab only)
description: >
  DVWA (the lab's pinned image), logged in as its documented lab accounts (admin as A,
  gordonb as B), security level "low". Ground truth: DVWA's own source for each module at "low"
  (vulnerabilities/<module>/source/low.php in the pinned image), confirmed by the pinned
  OWASP ZAP oracle (test_corpus/oracles/zap). Active tests are GET-only (ADR-0008 §4):
  POST-only modules (xss_s, exec, upload, captcha, csp, weak_id) are outside what the checks
  declare, and state-changing GET forms (csrf, brute) are never requested (do-no-harm).
  SSRF: fi includes $_GET['page'] and the image's Apache PHP includes remote URLs (reproduced
  2026-11-24: fi/?page=http://<listener>/... fetched the listener and printed its body), so the
  server fetches any URL given (remote file inclusion; SSRF confirmed out of band). IDOR: DVWA keeps no per-account objects; every module page shows
  the viewing account, so B never sees A's account line (false-positive control).
checks: [active_xss, active_sqli, active_redirect, active_cors, active_ssrf, active_idor]
expect:
  - check: active_xss
    key: reflected_xss
    location: http://dvwa.lab.test/vulnerabilities/xss_r/?name
    why: "xss_r low.php echoes $_GET['name'] into the page without encoding."
  - check: active_sqli
    key: sql_injection
    location: http://dvwa.lab.test/vulnerabilities/sqli/?id
    why: "sqli low.php puts $_GET['id'] into a quoted SQL string and prints mysqli_error() on failure."
  - check: active_sqli
    key: sql_injection
    location: http://dvwa.lab.test/vulnerabilities/sqli_blind/?id
    why: "sqli_blind low.php puts $_GET['id'] into a quoted SQL string; the page says whether a row exists (boolean-based)."
  - check: active_redirect
    key: open_redirect
    location: http://dvwa.lab.test/vulnerabilities/open_redirect/source/low.php?redirect
    why: "open_redirect low.php sends header('location: ' . $_GET['redirect']) for any value."
  - check: active_ssrf
    key: ssrf_confirmed
    location: http://dvwa.lab.test/vulnerabilities/fi/?page
    why: "fi low.php includes $_GET['page']; Apache's PHP includes remote URLs, so the server fetches any URL it is given."
