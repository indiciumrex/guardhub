target: av-redirect
origin: http://av-redirect.lab.test
active: true
description: >
  Gate M purpose-built site (avlab.py, site_redirect): open redirects through Location, a
  "starts with a slash" check that lets //host through, and the Refresh header; a meta refresh
  in the body (outside: no redirect header); next to look-alikes that allow only same-site
  paths, ignore the parameter, show it as data, or redirect within the site. Ground truth: the
  VULN lines of avlab.py, confirmed by ZAP.
checks: [active_xss, active_sqli, active_redirect, active_cors, active_ssrf, active_idor]
expect:
  - check: active_redirect
    key: open_redirect
    location: http://av-redirect.lab.test/go?url
    why: "url goes into Location unchecked."
  - check: active_redirect
    key: open_redirect
    location: http://av-redirect.lab.test/login?next
    why: "next only has to start with a slash, so //other-host/ is accepted (protocol-relative)."
  - check: active_redirect
    key: open_redirect
    location: http://av-redirect.lab.test/out?to
    why: "to goes into the Refresh header unchecked."
  - check: active_redirect
    key: open_redirect
    location: http://av-redirect.lab.test/jump?dest
    outside: true # meta refresh in the HTML body: active_redirect declares the Location and Refresh headers only
    why: "dest goes into a meta refresh URL (encoded for HTML, never checked)."
oracle_disputed: # ZAP verdicts judged wrong, with the evidence (test_corpus/oracles/zap/compare.py)
  - check: active_redirect
    location: http://av-redirect.lab.test/login?next
    why: >-
      ZAP misses it at attack strength HIGH (Gate M run 45446632581 and a local rerun) although its
      rule has a "//host" payload. The source accepts any next starting with "/", and
      GET /login?next=//gh-canary.invalid/ answers 302 Location: //gh-canary.invalid/, which every
      browser follows to that other host (a protocol-relative URL).
