target: rp-deps-traps
repo: lab/rp-deps-traps
description: >
  Nothing exact to read: ranges without a lockfile, an unpinned/VCS requirements file, a committed node_modules (vendored, skipped). Real but outside the declared scope: yarn.lock (not supported yet) and a vendored requirements file.
checks: [dependency_vulns, repo_secrets]
expect:
