  - {check: dependency_vulns, key: vulnerable_dependency_high, location: "https://github.com/lab/rp-deps-traps/blob/HEAD/yarn.lock#lodash", params: {fixed_version: "4.18.0"}, outside: true, why: "osv-scanner v2.2.4: lodash@4.17.15 has 5 advisory group(s), max rating HIGH; lowest version fixing all: 4.18.0; outside the declared scope: yarn.lock is not supported yet"}
