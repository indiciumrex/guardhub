target: dns-plusall
origin: http://plusall.dns.lab.test
description: >
  SPF 'v=spf1 mx +all' (test_corpus/dns/; verified with dig against dns-res, ns and ns-open).
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email, subdomain_takeover, tls_depth, header_quality, dns_depth, cookie_depth, exposed_files]
expect:
  - {check: tls_cert, key: https_unavailable, why: "Plain HTTP only (dns-web): nothing listens on 443."}
  - {check: dns_email, key: spf_allow_all, why: "dig: the SPF record ends in +all: every sender passes SPF (and so DMARC alignment)."}
  - {check: dns_depth, key: mta_sts_missing, why: "DNS oracle (BIND dig/delv, OpenSSL, curl; test_corpus/oracles/dns, lab run 2026-11-23): MX: mx.plusall.dns.lab.test; _mta-sts: no single valid v=STSv1 record"}
