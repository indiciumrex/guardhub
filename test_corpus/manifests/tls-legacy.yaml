target: tls-legacy
origin: https://tls-legacy.lab.test
description: >
  Hardened like clean.lab.test (nginx/good_headers.inc) and wrong in exactly one TLS
  property (see nginx/tls-legacy.conf and the labpki kind in docker-compose.lab.yml).
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email, subdomain_takeover, tls_depth]
expect:
  - check: tls_cert
    key: legacy_tls_supported
    why: "nginx ssl_protocols includes TLSv1 (SECLEVEL=0)."
