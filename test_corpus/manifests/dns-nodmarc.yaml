target: dns-nodmarc
origin: http://nodmarc.dns.lab.test
description: >
  MX + SPF, but no DMARC at the host nor at the organisational domain (test_corpus/dns/; verified with dig against dns-res, ns and ns-open).
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email, subdomain_takeover, tls_depth, header_quality, dns_depth, cookie_depth, exposed_files, js_libraries, content_signals]
expect:
  - {check: tls_cert, key: https_unavailable, why: "Plain HTTP only (dns-web): nothing listens on 443."}
  - {check: dns_email, key: dmarc_missing, why: "dig: _dmarc.nodmarc.dns.lab.test has no TXT; _dmarc.lab.test is NXDOMAIN."}
  - {check: dns_depth, key: mta_sts_missing, why: "DNS oracle (BIND dig/delv, OpenSSL, curl; test_corpus/oracles/dns, lab run 2026-11-23): MX: mx.nodmarc.dns.lab.test; _mta-sts: no single valid v=STSv1 record"}
