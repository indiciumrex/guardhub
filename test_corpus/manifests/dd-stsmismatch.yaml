target: dd-stsmismatch
origin: http://stsmismatch.dd.lab.test
description: >
  as dd-good, but the enforce policy lists mx.elsewhere.dd.lab.test only (test_corpus/dns/dd/).
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email, subdomain_takeover, tls_depth, header_quality, dns_depth, cookie_depth, exposed_files]
expect:
  - {check: tls_cert, key: https_unavailable, why: "Plain HTTP only (dns-web): nothing listens on 443."}
  - {check: dns_depth, key: mta_sts_mx_mismatch, why: "DNS oracle (BIND dig/delv, OpenSSL, curl; test_corpus/oracles/dns, lab run 2026-11-23): MX: mx.stsmismatch.dd.lab.test; curl https://mta-sts.stsmismatch.dd.lab.test/.well-known/mta-sts.txt: HTTP 200 text/plain Policy mx: mx.elsewhere.dd.lab.test only (dns/dd-sts/)."}
