target: tls-expired
origin: https://tls-expired.lab.test
description: >
  Hardened like clean.lab.test (nginx/good_headers.inc) and wrong in exactly one TLS
  property (see nginx/tls-expired.conf and the labpki kind in docker-compose.lab.yml).
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email, subdomain_takeover, tls_depth, header_quality]
expect:
  - check: tls_cert
    key: cert_expired
    why: "labpki 'expired': notAfter is 30 days in the past (chain otherwise valid)."
