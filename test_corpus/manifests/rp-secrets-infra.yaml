target: rp-secrets-infra
repo: lab/rp-secrets-infra
description: >
  Infrastructure repository with 8 planted secrets (Terraform, .npmrc, notebook, Kubernetes, Ansible, compose, bot config).
checks: [dependency_vulns, repo_secrets]
expect:
  - {check: repo_secrets, key: hardcoded_secret, location: "https://github.com/lab/rp-secrets-infra/blob/HEAD/terraform/prod.tfvars#aws_secret_access_key", why: "planted: aws_secret_access_key = 40-char key (gitleaks keys on the AKIA id, here AWS's documented EXAMPLE id, which it allowlists); verified by construction (labfixture generator)"}
  - {check: repo_secrets, key: hardcoded_secret, location: "https://github.com/lab/rp-secrets-infra/blob/HEAD/.npmrc#npm_token", why: "planted: npm automation token in .npmrc; gitleaks v8.21.2: npm-access-token"}
  - {check: repo_secrets, key: hardcoded_secret, location: "https://github.com/lab/rp-secrets-infra/blob/HEAD/notebooks/explore.ipynb#huggingface_token", why: "planted: Hugging Face token in a notebook cell; gitleaks v8.21.2: huggingface-access-token"}
  - {check: repo_secrets, key: hardcoded_secret, location: "https://github.com/lab/rp-secrets-infra/blob/HEAD/k8s/do-secret.yaml#digitalocean_token", why: "planted: DigitalOcean token in a committed Kubernetes Secret; gitleaks v8.21.2: digitalocean-pat"}
  - {check: repo_secrets, key: hardcoded_secret, location: "https://github.com/lab/rp-secrets-infra/blob/HEAD/ci/notify.py#telegram_bot_token", why: "planted: Telegram bot token <id>:AA<33> (gitleaks' rule needs the keyword on the same line); verified by construction (labfixture generator)"}
  - {check: repo_secrets, key: hardcoded_secret, location: "https://github.com/lab/rp-secrets-infra/blob/HEAD/ansible/group_vars/all.yml#gitlab_pat", why: "planted: GitLab personal access token; gitleaks v8.21.2: gitlab-pat"}
  - {check: repo_secrets, key: hardcoded_secret, location: "https://github.com/lab/rp-secrets-infra/blob/HEAD/docker-compose.prod.yml#database_url", why: "planted: rediss URL with a password to cache.infra-prod.net (no gitleaks rule); verified by construction (labfixture generator)"}
  - {check: repo_secrets, key: hardcoded_secret, location: "https://github.com/lab/rp-secrets-infra/blob/HEAD/bot/config.json#slack_token", why: "planted: Slack bot token; gitleaks v8.21.2: slack-legacy-bot-token"}
