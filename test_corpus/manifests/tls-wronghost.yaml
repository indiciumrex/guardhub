target: tls-wronghost
origin: https://tls-wronghost.lab.test
description: >
  Hardened like clean.lab.test (nginx/good_headers.inc) and wrong in exactly one TLS
  property (see nginx/tls-wronghost.conf and the labpki kind in docker-compose.lab.yml).
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email, subdomain_takeover, tls_depth]
expect:
  - check: tls_cert
    key: cert_hostname_mismatch
    why: "labpki 'wronghost': the certificate names only other.lab.test."
