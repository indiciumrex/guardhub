target: hh-cors-public
origin: http://hh-cors-public.lab.test
description: >
  Hardened, with public CORS (Access-Control-Allow-Origin: *, no credentials): legitimate, a NEGATIVE (nginx/hh.conf; verified with curl incl. Origin headers).
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email, subdomain_takeover, tls_depth, header_quality, dns_depth, cookie_depth]
expect:
  - {check: tls_cert, key: https_unavailable, why: "Plain HTTP only: nothing listens on 443."}
