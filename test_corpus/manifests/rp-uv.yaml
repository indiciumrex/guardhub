target: rp-uv
repo: lab/rp-uv
description: >
  uv.lock with a workspace root, runtime chain and a dev group (dev-ness from the graph).
checks: [dependency_vulns, repo_secrets]
expect:
  - {check: dependency_vulns, key: vulnerable_dependency_high, location: "https://github.com/lab/rp-uv/blob/HEAD/uv.lock#anyio", params: {fixed_version: "4.14.2"}, why: "osv-scanner v2.2.4: anyio@4.4.0 has 2 advisory group(s), max rating CRITICAL; lowest version fixing all: 4.14.2"}
  - {check: dependency_vulns, key: vulnerable_dev_dependency, location: "https://github.com/lab/rp-uv/blob/HEAD/uv.lock#black", params: {fixed_version: "26.10.1"}, why: "osv-scanner v2.2.4: black@22.3.0 has 4 advisory group(s), max rating CRITICAL, development dependency; lowest version fixing all: 26.10.1"}
  - {check: dependency_vulns, key: vulnerable_dependency_high, location: "https://github.com/lab/rp-uv/blob/HEAD/uv.lock#starlette", params: {fixed_version: "1.3.1"}, why: "osv-scanner v2.2.4: starlette@0.27.0 has 7 advisory group(s), max rating HIGH; lowest version fixing all: 1.3.1"}
