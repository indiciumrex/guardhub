target: hh-cors-null
origin: http://hh-cors-null.lab.test
description: >
  Hardened, but CORS allows the null origin with credentials (nginx/hh.conf; verified with curl incl. Origin headers).
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email, subdomain_takeover, tls_depth]
expect:
  - {check: tls_cert, key: https_unavailable, why: "Plain HTTP only: nothing listens on 443."}
  - {check: http_hardening, key: cors_null_origin_with_credentials, why: "Origin null gets Access-Control-Allow-Origin: null + Allow-Credentials: true; other origins are not echoed."}
