target: dns-dkimonly
origin: http://dkimonly.dns.lab.test
description: >
  Provider-style sending domain: no MX/SPF at the From domain (they sit on send.<domain>), only DKIM + DMARC p=none, like guardhub.dev itself (test_corpus/dns/; verified with dig against dns-res).
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email, subdomain_takeover, tls_depth, header_quality, dns_depth, cookie_depth, exposed_files, js_libraries, content_signals]
expect:
  - {check: tls_cert, key: https_unavailable, why: "Plain HTTP only (dns-web): nothing listens on 443."}
  - {check: dns_email, key: dmarc_not_enforced, why: "dig: _dmarc.dkimonly.dns.lab.test is 'v=DMARC1; p=none;'; the domain sends mail via DKIM (resend._domainkey)."}
