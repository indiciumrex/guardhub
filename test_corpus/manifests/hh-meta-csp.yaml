target: hh-meta-csp
origin: http://hh-meta-csp.lab.test
description: >
  Hardened, but the CSP is delivered in a <meta> tag only (static-host style): a NEGATIVE for csp_missing (nginx/hh.conf; verified with curl incl. Origin headers).
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email]
expect:
  - {check: tls_cert, key: https_unavailable, why: "Plain HTTP only: nothing listens on 443."}
