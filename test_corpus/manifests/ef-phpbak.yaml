target: ef-phpbak
origin: https://ef-phpbak.lab.test
description: >
  clean.lab.test's headers and TLS; PHP source backup at /wp-config.php.bak (positive: source_backup_exposed) (test_corpus/ef-init.sh).
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email, subdomain_takeover, tls_depth, header_quality, dns_depth, cookie_depth, exposed_files, js_libraries]
expect:
  - {check: exposed_files, key: source_backup_exposed, location: "https://ef-phpbak.lab.test/wp-config.php.bak", why: "Files oracle (curl + libmagic, lab run 2026-11-23): /wp-config.php.bak: libmagic 'PHP script, ASCII text'."}
