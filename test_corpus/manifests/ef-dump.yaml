target: ef-dump
origin: https://ef-dump.lab.test
description: >
  clean.lab.test's headers and TLS; SQL dump with data at /backup.sql (positive: database_dump_exposed) (test_corpus/ef-init.sh).
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email, subdomain_takeover, tls_depth, header_quality, dns_depth, cookie_depth, exposed_files, js_libraries, content_signals]
expect:
  - {check: exposed_files, key: database_dump_exposed, location: "https://ef-dump.lab.test/backup.sql", why: "Files oracle (curl + libmagic, lab run 2026-11-23): /backup.sql: libmagic 'ASCII text', MySQL dump header and INSERT INTO data rows."}
