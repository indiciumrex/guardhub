target: dd-broken
origin: http://broken.dd.lab.test
description: >
  as dd-good, but the DS record at dd.lab.test is that of another key (test_corpus/dns/dd/).
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email, subdomain_takeover, tls_depth, header_quality, dns_depth, cookie_depth, exposed_files, js_libraries]
expect:
  - {check: tls_cert, key: https_unavailable, why: "Plain HTTP only (dns-web): nothing listens on 443."}
  - {check: dns_depth, key: dnssec_broken, why: "DNS oracle (BIND dig/delv, OpenSSL, curl; test_corpus/oracles/dns, lab run 2026-11-23): delv broken.dd.lab.test (anchor = parent DS): ;; validating broken.dd.lab.test/DNSKEY: no valid signature found (DS)"}
