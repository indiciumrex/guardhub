target: dd-notlsrpt
origin: http://notlsrpt.dd.lab.test
description: >
  as dd-good, without the _smtp._tls (TLS-RPT) record (test_corpus/dns/dd/).
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email, subdomain_takeover, tls_depth, header_quality, dns_depth, cookie_depth, exposed_files, js_libraries, content_signals]
expect:
  - {check: tls_cert, key: https_unavailable, why: "Plain HTTP only (dns-web): nothing listens on 443."}
  - {check: dns_depth, key: tlsrpt_missing, why: "DNS oracle (BIND dig/delv, OpenSSL, curl; test_corpus/oracles/dns, lab run 2026-11-23): MX: mx.notlsrpt.dd.lab.test; curl https://mta-sts.notlsrpt.dd.lab.test/.well-known/mta-sts.txt: HTTP 200 text/plain dig TXT _smtp._tls: no v=TLSRPTv1 record."}
