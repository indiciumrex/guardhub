target: st-bitbucket
origin: http://bbpos.st.lab.test
description: >
  NOT in CT; docs.bbpos (a common name) is a CNAME to a deleted Bitbucket static site (test_corpus/dns/st.lab.test.db, ct/, nginx/providers.conf; verified with dig against dns-res and curl inside the lab).
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email, subdomain_takeover, tls_depth, header_quality, dns_depth, cookie_depth, exposed_files, js_libraries, content_signals, js_secrets]
expect:
  - {check: tls_cert, key: https_unavailable, why: "Plain HTTP only (dns-web): nothing listens on 443."}
  - {check: subdomain_takeover, key: unclaimed_resource, location: "http://docs.bbpos.st.lab.test/", why: "CT answer is []; dig CNAME docs.bbpos.st.lab.test -> bbpos.bitbucket.io; curl -> 404 \"Repository not found\"."}
