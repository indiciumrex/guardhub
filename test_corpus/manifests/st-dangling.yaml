target: st-dangling
origin: http://dangpos.st.lab.test
description: >
  CT lists old.dangpos, a CNAME to a missing name at a provider NOT on the list (test_corpus/dns/st.lab.test.db, ct/, nginx/providers.conf; verified with dig against dns-res and curl inside the lab).
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email, subdomain_takeover, tls_depth, header_quality, dns_depth, cookie_depth, exposed_files, js_libraries]
expect:
  - {check: tls_cert, key: https_unavailable, why: "Plain HTTP only (dns-web): nothing listens on 443."}
  - {check: subdomain_takeover, key: dangling_cname, location: "CNAME old.dangpos.st.lab.test", why: "dig CNAME old.dangpos.st.lab.test -> site.gone-cdn.test; dig A site.gone-cdn.test -> NXDOMAIN; gone-cdn.test is not a listed provider, so low, not high."}
