target: drupal
origin: http://drupal.lab.test
description: >
  Drupal 11.2.8 (official image, pinned) with no configuration: / redirects to the web
  installer at /core/install.php ("Choose language | Drupal"), which lets anyone set up
  the site and its admin account. Verified with curl inside the lab.
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email, subdomain_takeover]
expect:
  - {check: default_creds, key: installer_exposed, why: "/core/install.php shows Drupal's web installer."}
  - {check: security_headers, key: csp_missing, why: "The installer page sends no Content-Security-Policy."}
  - {check: security_headers, key: nosniff_missing, why: "The installer page sends no X-Content-Type-Options."}
  - {check: security_headers, key: clickjacking_unprotected, why: "The installer page sends neither X-Frame-Options nor frame-ancestors."}
  - {check: info_leak, key: server_version_disclosed, why: "'Server: Apache/2.4.65 (Debian)'."}
  - {check: info_leak, key: framework_version_disclosed, why: "'X-Powered-By: PHP/8.4.15'."}
  - {check: tls_cert, key: https_unavailable, why: "Nothing listens on 443."}
