target: ef-dsstore
origin: https://ef-dsstore.lab.test
description: >
  clean.lab.test's headers and TLS; macOS .DS_Store at /.DS_Store (positive: ds_store_exposed) (test_corpus/ef-init.sh).
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email, subdomain_takeover, tls_depth, header_quality, dns_depth, cookie_depth, exposed_files]
expect:
