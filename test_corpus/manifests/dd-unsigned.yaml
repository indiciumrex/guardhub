target: dd-unsigned
origin: http://unsigned.dd.lab.test
description: >
  as dd-good, but the zone is not DNSSEC-signed, so its MX host's TLSA records are ignored (test_corpus/dns/dd/).
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email, subdomain_takeover, tls_depth, header_quality, dns_depth, cookie_depth, exposed_files, js_libraries, content_signals, js_secrets]
expect:
  - {check: tls_cert, key: https_unavailable, why: "Plain HTTP only (dns-web): nothing listens on 443."}
  - {check: dns_depth, key: dane_unsigned, why: "DNS oracle (BIND dig/delv, OpenSSL, curl; test_corpus/oracles/dns, lab run 2026-11-23): TLSA at _25._tcp.mx.unsigned.dd.lab.test, zone unsigned.dd.lab.test has no DS"}
