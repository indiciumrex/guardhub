target: tls-noredirect
origin: https://tls-noredirect.lab.test
description: >
  Hardened like clean.lab.test (nginx/good_headers.inc) and wrong in exactly one TLS
  property (see nginx/tls-noredirect.conf and the labpki kind in docker-compose.lab.yml).
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email, subdomain_takeover, tls_depth]
expect:
  - check: tls_cert
    key: http_not_redirected
    why: "Port 80 serves the page (200) instead of redirecting to HTTPS."
