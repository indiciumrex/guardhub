target: juice-shop
origin: http://juice-shop.lab.test:3000
description: >
  OWASP Juice Shop v17.1.0 (pinned by digest). A single-page app that answers 200 with
  its shell for ANY path (/.env, /.git/HEAD, /admin ...), so status-code-only detection
  produces false positives here. Facts below were verified with curl inside the lab.
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email, subdomain_takeover, tls_depth, header_quality, dns_depth, cookie_depth, exposed_files, js_libraries]
expect:
  - check: security_headers
    key: csp_missing
    why: "GET / has no Content-Security-Policy (only XCTO, XFO SAMEORIGIN, Feature-Policy)."
  - check: tls_cert
    key: https_unavailable
    why: "Nothing listens on 443: the app is served over plain HTTP only."
  - check: info_leak
    key: directory_listing_enabled
    outside: true # info_leak declares listings at / and common asset folders (/uploads/, /images/, ...)
    why: >-
      /ftp, /encryptionkeys and /support/logs are browsable directory indexes (documented
      challenges). One issue: info_leak reports listings once per site by design.
  - check: info_leak
    key: stack_trace_exposed
    outside: true # info_leak declares stack traces on the root and on its one 404 probe only
    why: "GET /rest/<unknown> returns 500 with an Express stack trace incl. /juice-shop/node_modules paths."
  - check: open_admin
    key: server_status_exposed
    why: "/metrics serves Prometheus metrics without authentication (documented challenge)."
  - check: header_quality
    key: permissions_policy_missing
    why: "Header oracle (CI header-truth run 45052035543, 2026-11-22): HTML 200 at http://juice-shop.lab.test:3000/ without a Permissions-Policy header, as the app ships."
  - check: header_quality
    key: coop_missing
    why: "Header oracle (CI header-truth run 45052035543, 2026-11-22): HTML 200 at http://juice-shop.lab.test:3000/ without a Cross-Origin-Opener-Policy header, as the app ships."
  - check: js_libraries
    key: vulnerable_js_library
    location: "http://cdnjs.cloudflare.com/ajax/libs/jquery/2.2.4/jquery.min.js"
    why: >-
      JS oracle (retire.js 6.1.1, repository pinned at RetireJS commit 0a99704, local lab run 2026-11-23): the home page loads //cdnjs.cloudflare.com/ajax/libs/jquery/2.2.4/jquery.min.js,
      jquery 2.2.4 by its URL, 6 vulnerabilities incl. CVE-2015-9251, CVE-2019-11358,
      CVE-2020-11022, CVE-2020-11023. OSV (recorded 2026-11-23, test_corpus/osv): npm jquery@2.2.4 has 4 advisories.
