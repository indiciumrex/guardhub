target: td-ocspmiss
origin: https://td-ocspmiss.lab.test
description: >
  Hardened like clean.lab.test (nginx/td.conf) and different in exactly one property:
  labpki 'ocspmiss': names an OCSP responder (http://ocsp.lab.test/), nothing stapled.
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email, subdomain_takeover, tls_depth]
expect:
  - check: tls_depth
    key: ocsp_stapling_missing
    why: "testssl.sh 3.2 (drwetter/testssl.sh@sha256:64bab3c1…, --add-ca lab root, run 2026-11-22): cert_ocspURL 'http://ocsp.lab.test/', OCSP_stapling 'not offered' (LOW)."
