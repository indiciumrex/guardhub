target: hh-referrer
origin: http://hh-referrer.lab.test
description: >
  Hardened, but Referrer-Policy: unsafe-url (nginx/hh.conf; verified with curl incl. Origin headers).
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email, subdomain_takeover, tls_depth]
expect:
  - {check: tls_cert, key: https_unavailable, why: "Plain HTTP only: nothing listens on 443."}
  - {check: http_hardening, key: referrer_policy_unsafe_url, why: "Referrer-Policy: unsafe-url (the only policy token)."}
