target: dd-nocaa
origin: http://nocaa.dd.lab.test
description: >
  as dd-good, without CAA (none at dd.lab.test nor lab.test) (test_corpus/dns/dd/).
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email, subdomain_takeover, tls_depth, header_quality, dns_depth]
expect:
  - {check: tls_cert, key: https_unavailable, why: "Plain HTTP only (dns-web): nothing listens on 443."}
  - {check: dns_depth, key: caa_missing, why: "DNS oracle (BIND dig/delv, OpenSSL, curl; test_corpus/oracles/dns, lab run 2026-11-23): CAA: none at nocaa.dd.lab.test, dd.lab.test, lab.test"}
