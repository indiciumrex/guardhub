target: grafana
origin: http://grafana.lab.test:3000
description: >
  Grafana OSS 11.6.0 (pinned), default configuration: / redirects to /login, whose
  documented default account is admin/admin. Sends X-Frame-Options and nosniff, no CSP
  (Grafana's content_security_policy is off by default).
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email, subdomain_takeover, tls_depth, header_quality, dns_depth, cookie_depth, exposed_files, js_libraries]
expect:
  - {check: default_creds, key: default_login_product, why: "Grafana login with the documented default admin/admin account, never changed."}
  - {check: security_headers, key: csp_missing, why: "/login sends no Content-Security-Policy."}
  - {check: tls_cert, key: https_unavailable, why: "Nothing listens on 443."}
  - check: open_admin
    key: server_status_exposed
    why: >-
      /metrics serves Grafana's Prometheus metrics (text/plain, "# HELP"/"# TYPE") without
      authentication, Grafana's default. Missing from this manifest at first; the lab run
      surfaced it and curl confirmed it (2026-11-21).
  - check: header_quality
    key: permissions_policy_missing
    why: "Header oracle (CI header-truth run 45052035543, 2026-11-22): HTML 200 at http://grafana.lab.test:3000/login without a Permissions-Policy header, as the app ships."
  - check: header_quality
    key: coop_missing
    why: "Header oracle (CI header-truth run 45052035543, 2026-11-22): HTML 200 at http://grafana.lab.test:3000/login without a Cross-Origin-Opener-Policy header, as the app ships."
  - check: exposed_files
    key: source_map_exposed
    location: "http://grafana.lab.test:3000/public/build/runtime.a83631aa5c22ce7c0887.js.map"
    why: >-
      Files oracle (curl + Python html.parser, local run of the pinned image, 2026-11-23): / ->
      same-host redirect -> /login (200), whose script runtime.a83631aa5c22ce7c0887.js maps to
      this file: HTTP 200, version 3, 21 sources, 21 embedded (sourcesContent), served without
      authentication as Grafana ships. Missing from this manifest at first; CI's accuracy run
      45116314006 surfaced it as a false positive.
  - check: js_libraries
    key: vulnerable_js_library
    location: "http://grafana.lab.test:3000/public/build/6029.0549a3fcb50e73c4b256.js"
    outside: true # js_libraries declares scripts read up to the probe's 256 KiB; this banner is at byte 348922
    why: >-
      JS oracle (retire.js 6.1.1, repository pinned at RetireJS commit 0a99704, local lab run 2026-11-23): the bundle (409895 bytes) contains moment.js 2.30.1, 1 vulnerability
      (CVE-2026-17495). OSV (recorded 2026-11-23, test_corpus/osv): npm moment@2.30.1 has 1 advisory.
  - check: js_libraries
    key: vulnerable_js_library
    location: "http://grafana.lab.test:3000/public/build/4315.04038860e30ccfb6f1fb.js"
    outside: true # DOMPurify's banner is at byte 684198 (past 256 KiB); lodash is not in the declared catalogue
    why: >-
      JS oracle (retire.js 6.1.1, repository pinned at RetireJS commit 0a99704, local lab run 2026-11-23): the bundle (909850 bytes) contains DOMPurify 3.2.4 (22 vulnerabilities) and
      lodash 4.17.21 (2 vulnerabilities: CVE-2025-13465, CVE-2026-4800). OSV (recorded 2026-11-23, test_corpus/osv): npm
      dompurify@3.2.4 has 22 advisories.
