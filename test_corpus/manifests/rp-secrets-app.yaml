target: rp-secrets-app
repo: lab/rp-secrets-app
description: >
  Application repository with 10 planted secrets ({{secret:...}} templates, test_corpus/repos). gitleaks v8.21.2 on the materialized repository confirms each one it has a rule for.
checks: [dependency_vulns, repo_secrets]
expect:
  - {check: repo_secrets, key: hardcoded_secret, location: "https://github.com/lab/rp-secrets-app/blob/HEAD/.env#stripe_live_secret", why: "planted: committed .env with a live Stripe secret key; gitleaks v8.21.2: stripe-access-token"}
  - {check: repo_secrets, key: hardcoded_secret, location: "https://github.com/lab/rp-secrets-app/blob/HEAD/.env#sendgrid_key", why: "planted: committed .env with a SendGrid key; gitleaks v8.21.2: sendgrid-api-token"}
  - {check: repo_secrets, key: hardcoded_secret, location: "https://github.com/lab/rp-secrets-app/blob/HEAD/config/database.js#database_url", why: "planted: postgres URL with a password to the remote host db.shop-prod.io (gitleaks has no URL-credential rule); verified by construction (labfixture generator)"}
  - {check: repo_secrets, key: hardcoded_secret, location: "https://github.com/lab/rp-secrets-app/blob/HEAD/scripts/release.sh#github_pat", why: "planted: GitHub personal access token in a script; gitleaks v8.21.2: github-pat"}
  - {check: repo_secrets, key: hardcoded_secret, location: "https://github.com/lab/rp-secrets-app/blob/HEAD/deploy/server.key#private_key", why: "planted: PEM private key file; gitleaks v8.21.2: private-key"}
  - {check: repo_secrets, key: hardcoded_secret, location: "https://github.com/lab/rp-secrets-app/blob/HEAD/src/alerts.js#slack_webhook", why: "planted: Slack incoming webhook URL; gitleaks v8.21.2: slack-webhook-url"}
  - {check: repo_secrets, key: hardcoded_secret, location: "https://github.com/lab/rp-secrets-app/blob/HEAD/src/ai/summarize.py#openai_key", why: "planted: OpenAI project key (T3BlbkFJ marker); gitleaks v8.21.2: generic-api-key"}
  - {check: repo_secrets, key: test_mode_secret, location: "https://github.com/lab/rp-secrets-app/blob/HEAD/src/payments/checkout.ts#stripe_test_secret", why: "planted: Stripe TEST-mode secret key: low (no live money or data); gitleaks v8.21.2: stripe-access-token"}
  - {check: repo_secrets, key: generic_secret, location: "https://github.com/lab/rp-secrets-app/blob/HEAD/src/config.ts#generic", why: "planted: jwtSecret assigned a 32-char random value; gitleaks v8.21.2: generic-api-key"}
  - {check: repo_secrets, key: generic_secret, location: "https://github.com/lab/rp-secrets-app/blob/HEAD/src/settings.py#generic", why: "planted: Django SECRET_KEY assigned a 32-char random value; gitleaks v8.21.2: generic-api-key"}
