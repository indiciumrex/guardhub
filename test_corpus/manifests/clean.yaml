target: clean
origin: https://clean.lab.test
description: >
  Known-good reference (nginx/clean.conf): valid chain from the lab CA, TLS 1.2+ only,
  HTTP redirects to HTTPS, strict CSP/HSTS/nosniff/XFO, a __Host- cookie with every flag,
  no version in Server, real 404s. Every check must report NOTHING here.
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email, subdomain_takeover, tls_depth, header_quality, dns_depth, cookie_depth, exposed_files, js_libraries]
