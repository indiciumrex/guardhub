target: js-bootstrap
origin: https://js-bootstrap.lab.test
description: >
  clean.lab.test's headers and TLS; Bootstrap 3.3.7 (npm dist file) at /static/bootstrap.min.js (positive: vulnerable_js_library) (test_corpus/jslab).
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email, subdomain_takeover, tls_depth, header_quality, dns_depth, cookie_depth, exposed_files, js_libraries, content_signals]
expect:
  - {check: js_libraries, key: vulnerable_js_library, location: "https://js-bootstrap.lab.test/static/bootstrap.min.js", why: "JS oracle (retire.js 6.1.1, repository pinned at RetireJS commit 0a99704, local lab run 2026-11-23): /static/bootstrap.min.js is bootstrap 3.3.7 by its content, 8 vulnerabilities incl. CVE-2018-14040, CVE-2018-14042, CVE-2019-8331. OSV (recorded 2026-11-23, test_corpus/osv): npm bootstrap@3.3.7 has 7 advisories."}
