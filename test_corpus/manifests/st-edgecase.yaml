target: st-edgecase
origin: http://edgecase.st.lab.test
description: >
  GitHub Pages "There isn't a GitHub Pages site here." (Edge-case provider, not listed) and a listed fingerprint served by an unlisted provider (pages-host.test). NOTHING to report (test_corpus/dns/st.lab.test.db, ct/, nginx/providers.conf; verified with dig against dns-res and curl inside the lab).
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email, subdomain_takeover, tls_depth]
expect:
  - {check: tls_cert, key: https_unavailable, why: "Plain HTTP only (dns-web): nothing listens on 443."}
