target: dns-nullmx
origin: http://nullmx.dns.lab.test
description: >
  null MX (RFC 7505, accepts no mail) + 'v=spf1 -all': NOTHING to report (test_corpus/dns/; verified with dig against dns-res, ns and ns-open).
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email, subdomain_takeover, tls_depth, header_quality]
expect:
  - {check: tls_cert, key: https_unavailable, why: "Plain HTTP only (dns-web): nothing listens on 443."}
