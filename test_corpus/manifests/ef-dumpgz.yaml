target: ef-dumpgz
origin: https://ef-dumpgz.lab.test
description: >
  clean.lab.test's headers and TLS; gzip-compressed PostgreSQL dump with data at /db.sql.gz (positive: database_dump_exposed) (test_corpus/ef-init.sh).
checks: [exposed_env, security_headers, tls_cert, open_admin, default_creds, info_leak, tls_config, http_hardening, dns_email, subdomain_takeover, tls_depth, header_quality, dns_depth, cookie_depth, exposed_files, js_libraries]
expect:
  - {check: exposed_files, key: database_dump_exposed, location: "https://ef-dumpgz.lab.test/db.sql.gz", why: "Files oracle (curl + libmagic, lab run 2026-11-23): /db.sql.gz: libmagic 'gzip compressed data, max compression, from Unix'; decompressed: PostgreSQL dump header and COPY ... FROM stdin data rows."}
