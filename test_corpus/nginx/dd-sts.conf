# MTA-STS policy host of the dns_depth targets: https://mta-sts.<target>/.well-known/mta-sts.txt
# (RFC 8461 §3.3), one lab certificate per policy host (pki). Policies live in
# dns/dd-sts/<short name>/ (not "<name>.dd.lab.test": .gitignore ignores *.test);
# stsbroken.dd.lab.test has none on purpose (404).
server {
    listen 443 ssl;
    server_name ~^mta-sts\.(?<t>[a-z0-9-]+)\.dd\.lab\.test$;
    ssl_certificate     /pki/$ssl_server_name.crt;
    ssl_certificate_key /pki/$ssl_server_name.key;
    root /sts/$t;
    location = /.well-known/mta-sts.txt {
        default_type text/plain;
    }
    location / {
        return 404;
    }
}
