# clean.lab.test: the known-good reference. Every check must find NOTHING here.
server {
    listen 80;
    server_name clean.lab.test;
    server_tokens off;
    return 301 https://clean.lab.test$request_uri;
}
server {
    listen 443 ssl;
    server_name clean.lab.test;
    ssl_certificate     /pki/clean.lab.test.crt;
    ssl_certificate_key /pki/clean.lab.test.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Set-Cookie "__Host-sid=lab; Path=/; Secure; HttpOnly; SameSite=Lax" always;
    include /etc/nginx/lab/common.inc;
}
