# providers: stand-in for the providers' web fronts, answering for the lab subdomains that point
# into them (dns/st.lab.test.db), with the answers those providers give. "Unclaimed" bodies follow
# the fingerprints documented by can-i-take-over-xyz; claimed ones are ordinary pages.
server {
    listen 80 default_server;
    server_tokens off;
    location / { return 404; }
}
# AWS S3 REST endpoint, bucket deleted -> NoSuchBucket
server {
    listen 80;
    server_name assets.s3pos.st.lab.test;
    server_tokens off;
    default_type application/xml;
    location / { return 404 '<?xml version="1.0" encoding="UTF-8"?>\n<Error><Code>NoSuchBucket</Code><Message>The specified bucket does not exist</Message><BucketName>assets.s3pos.st.lab.test</BucketName><RequestId>LABREQ0000000001</RequestId><HostId>lab-host-id</HostId></Error>'; }
}
# AWS S3 website endpoint, bucket deleted
server {
    listen 80;
    server_name cdn.chainpos.st.lab.test;
    server_tokens off;
    default_type text/html;
    location / { return 404 '<html>\n<head><title>404 Not Found</title></head>\n<body>\n<h1>404 Not Found</h1>\n<ul>\n<li>Code: NoSuchBucket</li>\n<li>Message: The specified bucket does not exist</li>\n<li>BucketName: chainpos-media</li>\n<li>RequestId: LABREQ0000000002</li>\n</ul>\n<hr/>\n</body>\n</html>\n'; }
}
# AWS S3, bucket exists but is private -> AccessDenied (claimed)
server {
    listen 80;
    server_name files.claimed.st.lab.test;
    server_tokens off;
    default_type application/xml;
    location / { return 403 '<?xml version="1.0" encoding="UTF-8"?>\n<Error><Code>AccessDenied</Code><Message>Access Denied</Message><RequestId>LABREQ0000000003</RequestId></Error>'; }
}
# Bitbucket Cloud static site, repository deleted
server {
    listen 80;
    server_name docs.bbpos.st.lab.test;
    server_tokens off;
    default_type text/html;
    location / { return 404 '<!DOCTYPE html><html><head><title>Bitbucket</title></head><body><h1>Repository not found</h1></body></html>\n'; }
}
# Bitbucket Cloud static site that exists (claimed)
server {
    listen 80;
    server_name docs.claimed.st.lab.test;
    server_tokens off;
    default_type text/html;
    location / { return 200 '<!DOCTYPE html><html><head><title>Claimed docs</title></head><body><h1>Documentation</h1><p>Repository not found errors are explained on the troubleshooting page.</p></body></html>\n'; }
}
# Surge.sh, project deleted
server {
    listen 80;
    server_name www.surgepos.st.lab.test;
    server_tokens off;
    default_type text/html;
    location / { return 404 '<!doctype html><html><head><title>project not found</title></head><body><h1>project not found</h1><p>Why am I seeing this page?</p></body></html>\n'; }
}
# GitHub Pages, no site ("Edge case" provider: NOT on the list -> no finding)
server {
    listen 80;
    server_name blog.edgecase.st.lab.test;
    server_tokens off;
    default_type text/html;
    location / { return 404 '<!DOCTYPE html><html><head><title>Site not found &middot; GitHub Pages</title></head><body><div class="container"><h1>404</h1><p><strong>There isn\'t a GitHub Pages site here.</strong></p></div></body></html>\n'; }
}
# an UNLISTED provider that happens to show a listed fingerprint -> no finding
server {
    listen 80;
    server_name help.edgecase.st.lab.test;
    server_tokens off;
    default_type text/html;
    location / { return 404 '<html><body><h1>Repository not found</h1><p>project not found</p></body></html>\n'; }
}
