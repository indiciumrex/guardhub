# content_signals targets (ADR-0007): clean.lab.test's headers and TLS (the CSP allows exactly the
# test hosts, so the browser reaches its mixed-content decision), one page each (test_corpus/cs/).

# cs-script.lab.test: an HTTPS page loading a script over http:// (positive: mixed_content_active)
server {
    listen 80;
    server_name cs-script.lab.test;
    server_tokens off;
    return 301 https://cs-script.lab.test$request_uri;
}
server {
    listen 443 ssl;
    server_name cs-script.lab.test;
    ssl_certificate     /pki/cs-script.lab.test.crt;
    ssl_certificate_key /pki/cs-script.lab.test.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' http://cs-assets.lab.test; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Set-Cookie "__Host-sid=lab; Path=/; Secure; HttpOnly; SameSite=Lax" always;
    server_tokens off;
    root /srv/cs/script;
    location = / { try_files /index.html =404; }
    location / { try_files $uri =404; }
}

