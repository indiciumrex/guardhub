# tls-nopfs.lab.test: RSA certificate, TLS 1.2 only, static-RSA key exchange
# only (no ECDHE/DHE), so no session has forward secrecy.
server {
    listen 80;
    server_name tls-nopfs.lab.test;
    server_tokens off;
    return 301 https://tls-nopfs.lab.test$request_uri;
}
server {
    listen 443 ssl;
    server_name tls-nopfs.lab.test;
    ssl_certificate     /pki/tls-nopfs.lab.test.crt;
    ssl_certificate_key /pki/tls-nopfs.lab.test.key;
    ssl_protocols TLSv1.2;
    ssl_ciphers AES128-GCM-SHA256:AES256-GCM-SHA384;
    include /etc/nginx/lab/good_headers.inc;
    include /etc/nginx/lab/common.inc;
}
