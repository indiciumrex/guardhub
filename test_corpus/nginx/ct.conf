# ct.lab.test: stand-in for the Certificate Transparency search service (crt.sh JSON API) that
# subdomain_takeover asks in production (SCANNER_CT_URL). Answers GET /?q=%25.<domain>&output=json
# with the crt.sh-format file for that domain (test_corpus/ct/), "[]" for any other domain.
map $arg_q $ct_name {
    default                      empty;
    "%25.s3pos.st.lab.test"      s3pos;
    "%25.azpos.st.lab.test"      azpos;
    "%25.surgepos.st.lab.test"   surgepos;
    "%25.dangpos.st.lab.test"    dangpos;
    "%25.chainpos.st.lab.test"   chainpos;
    "%25.claimed.st.lab.test"    claimed;
    "%25.edgecase.st.lab.test"   edgecase;
    "%25.plain.st.lab.test"      plain;
    "%25.scope.st.lab.test"      scope;
}
server {
    listen 80 default_server;
    server_tokens off;
    root /ct;
    default_type application/json;
    location = / { try_files /$ct_name.json =500; }
    location / { return 404; }
}
