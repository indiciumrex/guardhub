# leaky.lab.test: a careless static deployment. Defaults everywhere (version in
# Server, no security headers), the whole project directory as web root
# (.env, .git, .aws served), and autoindex on /backup/. Plain HTTP only.
server {
    listen 80;
    server_name leaky.lab.test;
    root /srv/leak;
    location /backup/ { autoindex on; }
}
