# tls-weak.lab.test: also accepts NULL (no encryption) and anonymous (no
# authentication) cipher suites on TLS 1.2. TLS 1.3 stays on.
server {
    listen 80;
    server_name tls-weak.lab.test;
    server_tokens off;
    return 301 https://tls-weak.lab.test$request_uri;
}
server {
    listen 443 ssl;
    server_name tls-weak.lab.test;
    ssl_certificate     /pki/tls-weak.lab.test.crt;
    ssl_certificate_key /pki/tls-weak.lab.test.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:eNULL:aNULL:@SECLEVEL=0;
    include /etc/nginx/lab/good_headers.inc;
    include /etc/nginx/lab/common.inc;
}
