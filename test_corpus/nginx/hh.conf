# http_hardening targets (plain HTTP, one container, one server block per name). Each is
# hardened like clean.lab.test (CSP, nosniff, XFO, Referrer-Policy) EXCEPT the one property
# its name says. Some are deliberate NEGATIVES (must produce no finding).

map $http_origin $null_origin {
    "null"  "null";
    default "";
}

# 1. CORS reflects ANY origin with credentials (positive, high)
server {
    listen 80;
    server_name hh-cors-cred.lab.test;
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    include /etc/nginx/lab/common.inc;
}

# 2. CORS trusts the "null" origin with credentials (positive, medium)
server {
    listen 80;
    server_name hh-cors-null.lab.test;
    add_header Access-Control-Allow-Origin $null_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    include /etc/nginx/lab/common.inc;
}

# 3. Public CORS ("*", no credentials): legitimate for public data (NEGATIVE)
server {
    listen 80;
    server_name hh-cors-public.lab.test;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    include /etc/nginx/lab/common.inc;
}

# 4. CSP present but scripts unrestricted: inline + any https: host (positive, low)
server {
    listen 80;
    server_name hh-csp-weak.lab.test;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https:; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    include /etc/nginx/lab/common.inc;
}

# 5. Nonce + 'strict-dynamic' policy: 'unsafe-inline' and https: are IGNORED by
#    browsers here (backwards-compatible strict CSP, as Google recommends) (NEGATIVE)
server {
    listen 80;
    server_name hh-csp-strict.lab.test;
    add_header Content-Security-Policy "script-src 'nonce-labN0nce' 'strict-dynamic' 'unsafe-inline' https: http:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    include /etc/nginx/lab/common.inc;
}

# 6. CSP only in <meta> (static hosting style): a CSP is present (NEGATIVE for csp_missing)
server {
    listen 80;
    server_name hh-meta-csp.lab.test;
    server_tokens off;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    location = / { try_files /meta-csp.html =404; }
    location / { return 404; }
}

# 7. X-Frame-Options ALLOW-FROM (ignored by browsers) and no frame-ancestors (positive, low)
server {
    listen 80;
    server_name hh-xfo-allowfrom.lab.test;
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "ALLOW-FROM https://partner.lab.test" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    include /etc/nginx/lab/common.inc;
}

# 8. Referrer-Policy: unsafe-url (positive, low)
server {
    listen 80;
    server_name hh-referrer.lab.test;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "unsafe-url" always;
    include /etc/nginx/lab/common.inc;
}

# 9. Laravel/Angular-style XSRF-TOKEN cookie, readable by JavaScript BY DESIGN (no HttpOnly),
#    with SameSite (NEGATIVE for cookie_flags_missing)
server {
    listen 80;
    server_name hh-csrf-cookie.lab.test;
    add_header Set-Cookie "XSRF-TOKEN=lab-csrf-token-not-secret; Path=/; SameSite=Lax" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    include /etc/nginx/lab/common.inc;
}
