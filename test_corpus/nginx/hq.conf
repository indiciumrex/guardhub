# header_quality targets (ADR-0007): clean.lab.test, different in exactly one header property.

# hq-eval.lab.test: CSP allows 'unsafe-eval' in script-src (positive: csp_unsafe_eval)
server {
    listen 80;
    server_name hq-eval.lab.test;
    server_tokens off;
    return 301 https://hq-eval.lab.test$request_uri;
}
server {
    listen 443 ssl;
    server_name hq-eval.lab.test;
    ssl_certificate     /pki/hq-eval.lab.test.crt;
    ssl_certificate_key /pki/hq-eval.lab.test.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Set-Cookie "__Host-sid=lab; Path=/; Secure; HttpOnly; SameSite=Lax" always;
    include /etc/nginx/lab/common.inc;
}

