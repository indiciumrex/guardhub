# tls-legacy.lab.test (generated layout, see test_corpus/README.md)
server {
    listen 80;
    server_name tls-legacy.lab.test;
    server_tokens off;
    return 301 https://tls-legacy.lab.test$request_uri;
}
server {
    listen 443 ssl;
    server_name tls-legacy.lab.test;
    ssl_certificate     /pki/tls-legacy.lab.test.crt;
    ssl_certificate_key /pki/tls-legacy.lab.test.key;
    # TLS 1.0 still enabled (needs OpenSSL security level 0 for the SHA-1 handshake)
    ssl_protocols TLSv1 TLSv1.2 TLSv1.3;
    ssl_ciphers DEFAULT:@SECLEVEL=0;
    include /etc/nginx/lab/good_headers.inc;
    include /etc/nginx/lab/common.inc;
}
