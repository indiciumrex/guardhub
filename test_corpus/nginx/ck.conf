# cookie_depth targets (ADR-0007): clean.lab.test, different only in its Set-Cookie header.

# ck-hostpath.lab.test: __Host- cookie with Path=/app (positive: cookie_prefix_invalid, path_not_root)
server {
    listen 80;
    server_name ck-hostpath.lab.test;
    server_tokens off;
    return 301 https://ck-hostpath.lab.test$request_uri;
}
server {
    listen 443 ssl;
    server_name ck-hostpath.lab.test;
    ssl_certificate     /pki/ck-hostpath.lab.test.crt;
    ssl_certificate_key /pki/ck-hostpath.lab.test.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Set-Cookie "__Host-sid=lab; Path=/app; Secure; HttpOnly; SameSite=Lax" always;
    include /etc/nginx/lab/common.inc;
}
