# tls-rsa1024.lab.test: a 1024-bit RSA certificate (needs security level 0 to load).
server {
    listen 80;
    server_name tls-rsa1024.lab.test;
    server_tokens off;
    return 301 https://tls-rsa1024.lab.test$request_uri;
}
server {
    listen 443 ssl;
    server_name tls-rsa1024.lab.test;
    ssl_certificate     /pki/tls-rsa1024.lab.test.crt;
    ssl_certificate_key /pki/tls-rsa1024.lab.test.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers DEFAULT:@SECLEVEL=0;
    include /etc/nginx/lab/good_headers.inc;
    include /etc/nginx/lab/common.inc;
}
