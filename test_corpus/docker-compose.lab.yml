# GuardHub validation lab (docs/accuracy/, test_corpus/README.md).
#
# DELIBERATELY VULNERABLE SOFTWARE. Everything runs on the `lab` network, which
# is `internal: true` (no route to the internet) and nothing is published to the
# host. The scanner can only scan *.lab.test hosts on its allowlist
# (queue.ScanLabOrigin). Never deploy any of this anywhere.
#
#   bash test_corpus/run.sh          # build, start, measure, write docs/accuracy, stop
name: guardhub-lab

x-nginx: &nginx
  image: nginx:1.27-alpine
  depends_on: { pki: { condition: service_completed_successfully } }
  read_only: true
  tmpfs: [/var/cache/nginx, /var/run, /tmp]

volumes:
  pki: {}
  ks: {}
  ef: {}
  ddkeys: {}
  leak: {}

networks:
  lab:
    internal: true

services:
  # throwaway CA + certificates, generated at every start (no key is ever committed)
  pki:
    build: { context: ../apps/scanner, dockerfile: ../../test_corpus/Dockerfile.lab }
    image: guardhub-lab-tools:local
    command:
      - labpki
      - -out
      - /pki
      - clean.lab.test:valid
      - tls-expired.lab.test:expired
      - tls-selfsigned.lab.test:selfsigned
      - tls-wronghost.lab.test:wronghost
      - tls-nochain.lab.test:nochain
      - tls-legacy.lab.test:valid
      - tls-noredirect.lab.test:valid
      - tls-weak.lab.test:valid
      - tls-3des.lab.test:rsa2048
      - tls-rc4.lab.test:rsa2048
      - tls-nopfs.lab.test:rsa2048
      - tls-rsa1024.lab.test:rsa1024
      - td-nosct.lab.test:nosct
      - td-sha1.lab.test:sha1
      - td-longlife.lab.test:longlife
      - td-ocsp.lab.test:ocsp
      - td-ocspmiss.lab.test:ocspmiss
      - td-preload.lab.test:valid
      - hq-eval.lab.test:valid
      - hq-wasm.lab.test:valid
      - hq-nonce.lab.test:valid
      - hq-object.lab.test:valid
      - hq-noperm.lab.test:valid
      - hq-cache.lab.test:valid
      - hq-private.lab.test:valid
      - ks-github.lab.test:valid
      - ks-inline.lab.test:valid
      - ks-privkey.lab.test:valid
      - ks-testkey.lab.test:valid
      - ks-public.lab.test:valid
      - cs-script.lab.test:valid
      - cs-style.lab.test:valid
      - cs-img.lab.test:valid
      - cs-sri.lab.test:valid
      - cs-sriok.lab.test:valid
      - cs-markup.lab.test:valid
      - js-jquery.lab.test:valid
      - js-bootstrap.lab.test:valid
      - js-moment.lab.test:valid
      - js-cdn.lab.test:valid
      - js-current.lab.test:valid
      - js-renamed.lab.test:valid
      - js-mention.lab.test:valid
      - ef-dump.lab.test:valid
      - ef-dumpgz.lab.test:valid
      - ef-phpbak.lab.test:valid
      - ef-archive.lab.test:valid
      - ef-dsstore.lab.test:valid
      - ef-sourcemap.lab.test:valid
      - ef-default.lab.test:valid
      - ef-schema.lab.test:valid
      - ef-phprun.lab.test:valid
      - ef-mapnames.lab.test:valid
      - ck-hostpath.lab.test:valid
      - ck-hostdomain.lab.test:valid
      - ck-secure.lab.test:valid
      - ck-domain.lab.test:valid
      - ck-domainself.lab.test:valid
      - ck-analytics.lab.test:valid
      - ck-foreign.lab.test:valid
      - mta-sts.good.dd.lab.test:valid
      - mta-sts.broken.dd.lab.test:valid
      - mta-sts.unsigned.dd.lab.test:valid
      - mta-sts.nocaa.dd.lab.test:valid
      - mta-sts.ststesting.dd.lab.test:valid
      - mta-sts.stsbroken.dd.lab.test:valid
      - mta-sts.stsmismatch.dd.lab.test:valid
      - mta-sts.notlsrpt.dd.lab.test:valid
      - mta-sts.dkim1024.dd.lab.test:valid
      - mta-sts.dkim512.dd.lab.test:valid
    volumes: [pki:/pki]
    network_mode: none

  # ---- known-good reference ----
  clean:
    <<: *nginx
    volumes: [./nginx/clean.conf:/etc/nginx/conf.d/default.conf:ro, ./nginx:/etc/nginx/lab:ro, ./site:/usr/share/nginx/html:ro, pki:/pki:ro]
    networks: { lab: { aliases: [clean.lab.test] } }

  # ---- TLS variants: each wrong in exactly one way ----
  tls-expired:
    <<: *nginx
    volumes: [./nginx/tls-expired.conf:/etc/nginx/conf.d/default.conf:ro, ./nginx:/etc/nginx/lab:ro, ./site:/usr/share/nginx/html:ro, pki:/pki:ro]
    networks: { lab: { aliases: [tls-expired.lab.test] } }
  tls-selfsigned:
    <<: *nginx
    volumes: [./nginx/tls-selfsigned.conf:/etc/nginx/conf.d/default.conf:ro, ./nginx:/etc/nginx/lab:ro, ./site:/usr/share/nginx/html:ro, pki:/pki:ro]
    networks: { lab: { aliases: [tls-selfsigned.lab.test] } }
  tls-wronghost:
    <<: *nginx
    volumes: [./nginx/tls-wronghost.conf:/etc/nginx/conf.d/default.conf:ro, ./nginx:/etc/nginx/lab:ro, ./site:/usr/share/nginx/html:ro, pki:/pki:ro]
    networks: { lab: { aliases: [tls-wronghost.lab.test] } }
  tls-nochain:
    <<: *nginx
    volumes: [./nginx/tls-nochain.conf:/etc/nginx/conf.d/default.conf:ro, ./nginx:/etc/nginx/lab:ro, ./site:/usr/share/nginx/html:ro, pki:/pki:ro]
    networks: { lab: { aliases: [tls-nochain.lab.test] } }
  tls-legacy:
    <<: *nginx
    volumes: [./nginx/tls-legacy.conf:/etc/nginx/conf.d/default.conf:ro, ./nginx:/etc/nginx/lab:ro, ./site:/usr/share/nginx/html:ro, pki:/pki:ro]
    networks: { lab: { aliases: [tls-legacy.lab.test] } }
  tls-noredirect:
    <<: *nginx
    volumes: [./nginx/tls-noredirect.conf:/etc/nginx/conf.d/default.conf:ro, ./nginx:/etc/nginx/lab:ro, ./site:/usr/share/nginx/html:ro, pki:/pki:ro]
    networks: { lab: { aliases: [tls-noredirect.lab.test] } }
  tls-weak:
    <<: *nginx
    volumes: [./nginx/tls-weak.conf:/etc/nginx/conf.d/default.conf:ro, ./nginx:/etc/nginx/lab:ro, ./site:/usr/share/nginx/html:ro, pki:/pki:ro]
    networks: { lab: { aliases: [tls-weak.lab.test] } }
  # Go crypto/tls (as in Traefik and other Go proxies): still serves 3DES/RC4 when configured,
  # which current OpenSSL builds cannot. labtls verify is the independent ground truth.
  tls-3des:
    image: guardhub-lab-tools:local
    depends_on: { pki: { condition: service_completed_successfully } }
    command: [labtls, serve, -name, tls-3des.lab.test, -cert, /pki/tls-3des.lab.test.crt, -key, /pki/tls-3des.lab.test.key,
              -suites, "C02F,C012"] # ECDHE-RSA-AES128-GCM-SHA256, ECDHE-RSA-3DES-EDE-CBC-SHA
    read_only: true
    volumes: [pki:/pki:ro]
    networks: { lab: { aliases: [tls-3des.lab.test] } }
  tls-rc4:
    image: guardhub-lab-tools:local
    depends_on: { pki: { condition: service_completed_successfully } }
    command: [labtls, serve, -name, tls-rc4.lab.test, -cert, /pki/tls-rc4.lab.test.crt, -key, /pki/tls-rc4.lab.test.key,
              -suites, "C02F,0005"] # ECDHE-RSA-AES128-GCM-SHA256, RSA-RC4-128-SHA
    read_only: true
    volumes: [pki:/pki:ro]
    networks: { lab: { aliases: [tls-rc4.lab.test] } }
  tls-nopfs:
    <<: *nginx
    volumes: [./nginx/tls-nopfs.conf:/etc/nginx/conf.d/default.conf:ro, ./nginx:/etc/nginx/lab:ro, ./site:/usr/share/nginx/html:ro, pki:/pki:ro]
    networks: { lab: { aliases: [tls-nopfs.lab.test] } }
  tls-rsa1024:
    <<: *nginx
    volumes: [./nginx/tls-rsa1024.conf:/etc/nginx/conf.d/default.conf:ro, ./nginx:/etc/nginx/lab:ro, ./site:/usr/share/nginx/html:ro, pki:/pki:ro]
    networks: { lab: { aliases: [tls-rsa1024.lab.test] } }
  # ---- tls_depth: one nginx, one server block per name (nginx/td.conf) ----
  td:
    <<: *nginx
    volumes: [./nginx/td.conf:/etc/nginx/conf.d/default.conf:ro, ./nginx:/etc/nginx/lab:ro, ./site:/usr/share/nginx/html:ro, pki:/pki:ro]
    networks: { lab: { aliases: [td-nosct.lab.test, td-sha1.lab.test, td-longlife.lab.test, td-ocsp.lab.test, td-ocspmiss.lab.test, td-preload.lab.test] } }
  # ---- header_quality: one nginx, one server block per name (nginx/hq.conf) ----
  hq:
    <<: *nginx
    volumes: [./nginx/hq.conf:/etc/nginx/conf.d/default.conf:ro, ./nginx:/etc/nginx/lab:ro, ./site:/usr/share/nginx/html:ro, pki:/pki:ro]
    networks: { lab: { aliases: [hq-eval.lab.test, hq-wasm.lab.test, hq-nonce.lab.test, hq-object.lab.test, hq-noperm.lab.test, hq-cache.lab.test, hq-private.lab.test] } }
  # ---- http_hardening: one nginx, one server block per name (nginx/hh.conf) ----
  hh:
    <<: *nginx
    volumes: [./nginx/hh.conf:/etc/nginx/conf.d/default.conf:ro, ./nginx:/etc/nginx/lab:ro, ./site:/usr/share/nginx/html:ro]
    networks: { lab: { aliases: [hh-cors-cred.lab.test, hh-cors-null.lab.test, hh-cors-public.lab.test, hh-csp-weak.lab.test, hh-csp-strict.lab.test, hh-meta-csp.lab.test, hh-xfo-allowfrom.lab.test, hh-referrer.lab.test, hh-csrf-cookie.lab.test] } }
  # ---- exposed_files: clean's headers, one forgotten file each (content from ef-init.sh) ----
  ef-init:
    image: nginx:1.27-alpine
    entrypoint: ["sh", "/ef-init.sh"]
    volumes: [./ef-init.sh:/ef-init.sh:ro, ./site:/site:ro, ef:/srv/ef]
    network_mode: none
  ef:
    <<: *nginx
    depends_on:
      pki: { condition: service_completed_successfully }
      ef-init: { condition: service_completed_successfully }
    volumes: [./nginx/ef.conf:/etc/nginx/conf.d/default.conf:ro, ef:/srv/ef:ro, pki:/pki:ro]
    networks: { lab: { aliases: [ef-dump.lab.test, ef-dumpgz.lab.test, ef-phpbak.lab.test, ef-archive.lab.test, ef-dsstore.lab.test, ef-sourcemap.lab.test, ef-default.lab.test, ef-schema.lab.test, ef-phprun.lab.test, ef-mapnames.lab.test] } }
  # ---- js_libraries: clean's headers, real library files from npm (jslab/Dockerfile) ----
  js:
    <<: *nginx
    build: { context: ./jslab }
    image: guardhub-lab-js:local
    volumes: [./nginx/js.conf:/etc/nginx/conf.d/default.conf:ro, pki:/pki:ro]
    networks: { lab: { aliases: [js-jquery.lab.test, js-bootstrap.lab.test, js-moment.lab.test, js-cdn.lab.test, js-current.lab.test, js-renamed.lab.test, js-mention.lab.test] } }
  # ---- content_signals: clean's headers, one page each (test_corpus/cs/) ----
  cs:
    <<: *nginx
    volumes: [./nginx/cs.conf:/etc/nginx/conf.d/default.conf:ro, ./cs:/srv/cs:ro, pki:/pki:ro]
    networks: { lab: { aliases: [cs-script.lab.test, cs-style.lab.test, cs-img.lab.test, cs-sri.lab.test, cs-sriok.lab.test, cs-markup.lab.test] } }
  # ---- js_secrets: clean's headers, planted secrets filled at lab start (test_corpus/ks/) ----
  ks-init:
    image: guardhub-lab-tools:local
    depends_on: { pki: { condition: service_completed_successfully } }
    command: ["labrepo", "materialize", "--repos", "/corpus/ks", "--out", "/srv/ks"]
    volumes: [./ks:/corpus/ks:ro, ks:/srv/ks]
    network_mode: none
  ks:
    <<: *nginx
    depends_on:
      pki: { condition: service_completed_successfully }
      ks-init: { condition: service_completed_successfully }
    volumes: [./nginx/ks.conf:/etc/nginx/conf.d/default.conf:ro, ks:/srv/ks:ro, pki:/pki:ro]
    networks: { lab: { aliases: [ks-github.lab.test, ks-inline.lab.test, ks-privkey.lab.test, ks-testkey.lab.test, ks-public.lab.test] } }
  # ---- cookie_depth: clean, different only in the Set-Cookie header (nginx/ck.conf) ----
  ck:
    <<: *nginx
    volumes: [./nginx/ck.conf:/etc/nginx/conf.d/default.conf:ro, ./nginx:/etc/nginx/lab:ro, ./site:/usr/share/nginx/html:ro, pki:/pki:ro]
    networks: { lab: { aliases: [ck-hostpath.lab.test, ck-hostdomain.lab.test, ck-secure.lab.test, ck-domain.lab.test, ck-domainself.lab.test, ck-analytics.lab.test, ck-foreign.lab.test] } }
  # ---- dns_email: three CoreDNS roles (test_corpus/dns/) + one web front for the targets ----
  dns-res: # the scanner's resolver (SCANNER_DNS_SERVER): lab zones + Docker DNS for the rest
    image: coredns/coredns:1.12.1@sha256:e8c262566636e6bc340ece6473b0eed193cad045384401529721ddbe6463d31c
    command: ["-conf", "/zones/Corefile.res"]
    depends_on: { ddkeys: { condition: service_completed_successfully } }
    volumes: [./dns:/zones:ro, ddkeys:/ddkeys:ro]
    networks: { lab: { aliases: [dns-res.lab.test] } }
  dns-ns: # ns.dns.lab.test: authoritative only, AXFR open for axfr.dns.lab.test only
    image: coredns/coredns:1.12.1@sha256:e8c262566636e6bc340ece6473b0eed193cad045384401529721ddbe6463d31c
    command: ["-conf", "/zones/Corefile.ns"]
    volumes: [./dns:/zones:ro]
    networks: { lab: { aliases: [ns.dns.lab.test] } }
  dns-open: # ns-open.dns.lab.test: nameserver of openres.dns.lab.test AND recursive for anyone
    image: coredns/coredns:1.12.1@sha256:e8c262566636e6bc340ece6473b0eed193cad045384401529721ddbe6463d31c
    command: ["-conf", "/zones/Corefile.open"]
    volumes: [./dns:/zones:ro]
    networks: { lab: { aliases: [ns-open.dns.lab.test] } }
  dns-web:
    <<: *nginx
    volumes: [./nginx/dns-web.conf:/etc/nginx/conf.d/default.conf:ro, ./nginx:/etc/nginx/lab:ro, ./site:/usr/share/nginx/html:ro]
    networks: { lab: { aliases: [good.dns.lab.test, nospf.dns.lab.test, plusall.dns.lab.test, chunked.dns.lab.test, twospf.dns.lab.test, toomany.dns.lab.test, nodmarc.dns.lab.test, pnone.dns.lab.test, nullmx.dns.lab.test, nomail.dns.lab.test, axfr.dns.lab.test, openres.dns.lab.test, dkimonly.dns.lab.test, dkimreject.dns.lab.test,
                                    good.dd.lab.test, broken.dd.lab.test, unsigned.dd.lab.test, nocaa.dd.lab.test, nosts.dd.lab.test, nomail.dd.lab.test, ststesting.dd.lab.test, stsbroken.dd.lab.test, stsmismatch.dd.lab.test, notlsrpt.dd.lab.test, dkim1024.dd.lab.test, dkim512.dd.lab.test, www.good.dd.lab.test,
                                    s3pos.st.lab.test, azpos.st.lab.test, bbpos.st.lab.test, surgepos.st.lab.test, dangpos.st.lab.test, chainpos.st.lab.test, claimed.st.lab.test, edgecase.st.lab.test, plain.st.lab.test, scope.st.lab.test] } }
  # ---- dns_depth: throwaway DNSSEC keys + the parent zone's DS records (dns/dd/), and the
  # MTA-STS policy host of the dd targets (https://mta-sts.<target>/.well-known/mta-sts.txt) ----
  ddkeys:
    image: guardhub-lab-tools:local
    depends_on: { pki: { condition: service_completed_successfully } }
    command: [labdns, -out, /ddkeys, -parent, /zones/dd/dd.lab.test.db,
              good.dd.lab.test:signed, broken.dd.lab.test:broken, nocaa.dd.lab.test:signed, nosts.dd.lab.test:signed,
              nomail.dd.lab.test:signed, ststesting.dd.lab.test:signed, stsbroken.dd.lab.test:signed,
              stsmismatch.dd.lab.test:signed, notlsrpt.dd.lab.test:signed, dkim1024.dd.lab.test:signed, dkim512.dd.lab.test:signed]
    volumes: [./dns:/zones:ro, ddkeys:/ddkeys]
    network_mode: none
  dd-sts:
    <<: *nginx
    volumes: [./nginx/dd-sts.conf:/etc/nginx/conf.d/default.conf:ro, ./dns/dd-sts:/sts:ro, pki:/pki:ro]
    networks: { lab: { aliases: [mta-sts.good.dd.lab.test, mta-sts.broken.dd.lab.test, mta-sts.unsigned.dd.lab.test, mta-sts.nocaa.dd.lab.test, mta-sts.ststesting.dd.lab.test, mta-sts.stsbroken.dd.lab.test, mta-sts.stsmismatch.dd.lab.test, mta-sts.notlsrpt.dd.lab.test, mta-sts.dkim1024.dd.lab.test, mta-sts.dkim512.dd.lab.test] } }
  # ---- subdomain_takeover: the CT search stand-in and the providers' web fronts (dns/st.lab.test.db) ----
  ct:
    <<: *nginx
    depends_on: []
    volumes: [./nginx/ct.conf:/etc/nginx/conf.d/default.conf:ro, ./ct:/ct:ro]
    networks: { lab: { aliases: [ct.lab.test] } }
  providers:
    <<: *nginx
    depends_on: []
    volumes: [./nginx/providers.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: { lab: { aliases: [assets.s3pos.st.lab.test, cdn.chainpos.st.lab.test, files.claimed.st.lab.test, docs.bbpos.st.lab.test, docs.claimed.st.lab.test, www.surgepos.st.lab.test, blog.edgecase.st.lab.test, help.edgecase.st.lab.test] } }
  tls-httponly:
    <<: *nginx
    volumes: [./nginx/tls-httponly.conf:/etc/nginx/conf.d/default.conf:ro, ./nginx:/etc/nginx/lab:ro, ./site:/usr/share/nginx/html:ro]
    networks: { lab: { aliases: [tls-httponly.lab.test] } }

  # ---- a careless static deployment (content generated at start, see leaky-init.sh) ----
  leaky-init:
    image: guardhub-lab-tools:local
    command: ["sh", "/leaky-init.sh"]
    volumes: [./leaky-init.sh:/leaky-init.sh:ro, leak:/srv/leak]
    network_mode: none
  leaky:
    image: nginx:1.27-alpine
    depends_on: { leaky-init: { condition: service_completed_successfully } }
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    volumes: [./nginx/leaky.conf:/etc/nginx/conf.d/default.conf:ro, leak:/srv/leak:ro]
    networks: { lab: { aliases: [leaky.lab.test] } }

  # ---- real products the existing checks look for (pinned by digest, default setups) ----
  phpmyadmin:
    image: phpmyadmin:5.2.2-apache@sha256:6b5ab5f9ebfe3dbb38388b5695c2ff5ba3e26cdc2c4ce0bd97092eefc6a20bfd
    environment: { PMA_HOST: dvwa-db }
    depends_on: [dvwa-db]
    networks: { lab: { aliases: [phpmyadmin.lab.test] } }
  grafana:
    image: grafana/grafana-oss:11.6.0@sha256:62d2b9d20a19714ebfe48d1bb405086081bc602aa053e28cf6d73c7537640dfb
    environment: { GF_ANALYTICS_REPORTING_ENABLED: "false", GF_ANALYTICS_CHECK_FOR_UPDATES: "false" }
    networks: { lab: { aliases: [grafana.lab.test] } }
  wordpress:
    image: wordpress:6.8.3-php8.3-apache@sha256:30bff39330d1693b0ce13d32fc9b7bb67193064f040b7d60d3494e136fa599d4
    environment: # throwaway lab credentials, not a secret
      WORDPRESS_DB_HOST: wordpress-db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp-lab-only
      WORDPRESS_DB_NAME: wordpress
    depends_on: [wordpress-db]
    networks: { lab: { aliases: [wordpress.lab.test] } }
  drupal:
    image: drupal:11.2.8-apache@sha256:789452563ec58dd90a1970e87b72840be8493f0bfef198c70cdd6c54d9b7a15c
    networks: { lab: { aliases: [drupal.lab.test] } }
  wordpress-db:
    image: mariadb:10.11.8@sha256:75f6e61397758489d1dccf95db33b6b49ebfc7ec1253d40060fdf8ceb7f938a3
    environment: # throwaway lab credentials, not a secret
      MARIADB_ROOT_PASSWORD: wp-lab-root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp-lab-only
    networks: [lab]

  # ---- third-party vulnerable applications (pinned) ----
  juice-shop:
    image: bkimminich/juice-shop:v17.1.0@sha256:57170ba190744b9e22469d9ab5934946cd3e53e2e66b12e4c0c1019e1bea7a6b
    networks: { lab: { aliases: [juice-shop.lab.test] } }
  dvwa:
    image: ghcr.io/digininja/dvwa@sha256:61167ec23fbf861f7d96a7beb4be3612d043d48dbc6b239d4f90d7e8cdff8115 # pinned by digest (pulled 2026-11-21); the "2.3.3" tag used elsewhere does not exist
    environment: { DB_SERVER: dvwa-db } # lab-only throwaway database, see dvwa-db
    depends_on: [dvwa-db]
    networks: { lab: { aliases: [dvwa.lab.test] } }
  dvwa-db:
    image: mariadb:10.11.8@sha256:75f6e61397758489d1dccf95db33b6b49ebfc7ec1253d40060fdf8ceb7f938a3
    environment: # throwaway lab credentials (DVWA's documented defaults), not a secret
      MARIADB_ROOT_PASSWORD: dvwa-lab-root
      MARIADB_DATABASE: dvwa
      MARIADB_USER: dvwa
      MARIADB_PASSWORD: p@ssw0rd
    networks: [lab]
  webgoat:
    image: webgoat/webgoat:v2023.8@sha256:01672eb9aeba60d042ae1131d6de683b98fa64e9da60fa5d3daad2642a6795dd
    networks: { lab: { aliases: [webgoat.lab.test] } }

  # ---- Gate M (ADR-0008 §9): purpose-built active-test sites + the lab's OOB collaborator ----
  avlab: # test_corpus/active/avlab/avlab.py: known VULN lines next to safe look-alikes
    image: python:3.12-alpine3.22@sha256:a190708a2dec1bd18b1decb539f8e8f5407abaa9bf39cacda583f7f8c11db322
    command: ["python3", "-I", "/app/avlab.py", "80"]
    read_only: true
    volumes: [./active/avlab:/app:ro]
    networks: { lab: { aliases: [av-xss.lab.test, av-sqli.lab.test, av-redirect.lab.test, av-cors.lab.test, av-cors-safe.lab.test, av-ssrf.lab.test, av-idor.lab.test, av-clean.lab.test] } }
  oob: # records hits for /t/<token>; the scanner asks it for its own tokens only
    image: guardhub-lab-tools:local
    depends_on: { pki: { condition: service_completed_successfully } }
    command: ["laboob", "--listen", ":80"]
    read_only: true
    networks: { lab: { aliases: [oob.lab.test] } }

  # ---- repository targets (ADR-0006 §10): GitHub API + OSV stand-in ----
  # Serves test_corpus/repos as lab/<dir> (planted secrets filled from {{secret:...}}
  # templates at request time) and replays the OSV answers recorded in test_corpus/osv;
  # an unrecorded OSV query is an error, never an empty answer.
  repolab:
    image: guardhub-lab-tools:local
    depends_on: { pki: { condition: service_completed_successfully } }
    command: ["labrepo", "serve", "--repos", "/corpus/repos", "--osv", "/corpus/osv", "--listen", ":80"]
    read_only: true
    volumes: [./repos:/corpus/repos:ro, ./osv:/corpus/osv:ro]
    networks: { lab: { aliases: [github.lab.test, osv.lab.test] } }

  # ---- the measurement (docker compose --profile run run --rm runner) ----
  runner:
    image: guardhub-lab-tools:local
    profiles: [run]
    environment:
      SCANNER_ALLOW_PRIVATE_HOSTS: >-
        clean.lab.test,tls-expired.lab.test,tls-selfsigned.lab.test,tls-wronghost.lab.test,
        tls-nochain.lab.test,tls-legacy.lab.test,tls-noredirect.lab.test,tls-httponly.lab.test,
        juice-shop.lab.test,dvwa.lab.test,webgoat.lab.test,leaky.lab.test,phpmyadmin.lab.test,
        grafana.lab.test,wordpress.lab.test,drupal.lab.test,tls-weak.lab.test,tls-3des.lab.test,
        tls-nopfs.lab.test,tls-rsa1024.lab.test,tls-rc4.lab.test,
        td-nosct.lab.test,td-sha1.lab.test,td-longlife.lab.test,td-ocsp.lab.test,td-ocspmiss.lab.test,td-preload.lab.test,
        hq-eval.lab.test,hq-wasm.lab.test,hq-nonce.lab.test,hq-object.lab.test,hq-noperm.lab.test,hq-cache.lab.test,hq-private.lab.test,
        hh-cors-cred.lab.test,hh-cors-null.lab.test,hh-cors-public.lab.test,hh-csp-weak.lab.test,hh-csp-strict.lab.test,hh-meta-csp.lab.test,hh-xfo-allowfrom.lab.test,hh-referrer.lab.test,hh-csrf-cookie.lab.test,
        good.dns.lab.test,nospf.dns.lab.test,plusall.dns.lab.test,chunked.dns.lab.test,twospf.dns.lab.test,toomany.dns.lab.test,nodmarc.dns.lab.test,pnone.dns.lab.test,nullmx.dns.lab.test,nomail.dns.lab.test,axfr.dns.lab.test,openres.dns.lab.test,dkimonly.dns.lab.test,dkimreject.dns.lab.test,ns.dns.lab.test,ns-open.dns.lab.test,
        ct.lab.test,s3pos.st.lab.test,azpos.st.lab.test,bbpos.st.lab.test,surgepos.st.lab.test,dangpos.st.lab.test,chainpos.st.lab.test,claimed.st.lab.test,edgecase.st.lab.test,plain.st.lab.test,scope.st.lab.test,
        assets.s3pos.st.lab.test,cdn.chainpos.st.lab.test,files.claimed.st.lab.test,docs.bbpos.st.lab.test,docs.claimed.st.lab.test,www.surgepos.st.lab.test,blog.edgecase.st.lab.test,help.edgecase.st.lab.test,
        good.dd.lab.test,broken.dd.lab.test,unsigned.dd.lab.test,nocaa.dd.lab.test,nosts.dd.lab.test,nomail.dd.lab.test,ststesting.dd.lab.test,stsbroken.dd.lab.test,stsmismatch.dd.lab.test,notlsrpt.dd.lab.test,dkim1024.dd.lab.test,dkim512.dd.lab.test,www.good.dd.lab.test,
        mta-sts.good.dd.lab.test,mta-sts.broken.dd.lab.test,mta-sts.unsigned.dd.lab.test,mta-sts.nocaa.dd.lab.test,mta-sts.ststesting.dd.lab.test,mta-sts.stsbroken.dd.lab.test,mta-sts.stsmismatch.dd.lab.test,mta-sts.notlsrpt.dd.lab.test,mta-sts.dkim1024.dd.lab.test,mta-sts.dkim512.dd.lab.test,
        ck-hostpath.lab.test,ck-hostdomain.lab.test,ck-secure.lab.test,ck-domain.lab.test,ck-domainself.lab.test,ck-analytics.lab.test,ck-foreign.lab.test,
        ef-dump.lab.test,ef-dumpgz.lab.test,ef-phpbak.lab.test,ef-archive.lab.test,ef-dsstore.lab.test,ef-sourcemap.lab.test,ef-default.lab.test,ef-schema.lab.test,ef-phprun.lab.test,ef-mapnames.lab.test,
        js-jquery.lab.test,js-bootstrap.lab.test,js-moment.lab.test,js-cdn.lab.test,js-current.lab.test,js-renamed.lab.test,js-mention.lab.test,
        cs-script.lab.test,cs-style.lab.test,cs-img.lab.test,cs-sri.lab.test,cs-sriok.lab.test,cs-markup.lab.test,
        ks-github.lab.test,ks-inline.lab.test,ks-privkey.lab.test,ks-testkey.lab.test,ks-public.lab.test,
        github.lab.test,osv.lab.test
      SCANNER_DNS_SERVER: dns-res.lab.test:53
      SCANNER_CT_URL: http://ct.lab.test/
      SCANNER_GITHUB_API_URL: http://github.lab.test
      SCANNER_OSV_URL: http://osv.lab.test
      LAB_SOURCE: ${LAB_SOURCE:-unknown}
    volumes:
      - ${LAB_MANIFESTS:-./manifests}:/corpus/manifests:ro
      - ./runner.sh:/corpus/runner.sh:ro
      - ../docs/accuracy:/out
      - ../packages/shared:/shared
      - pki:/pki:ro
    entrypoint: ["sh", "/corpus/runner.sh"]
    networks: [lab]
