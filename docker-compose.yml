# GuardHub: the whole stack with one command.
#   1) python ops/scripts/gen_secrets.py     (creates .env with strong random secrets)
#   2) docker compose up --build
#   3) open http://localhost:3000
# Only `web` is published to the host. PostgreSQL, Redis and the API sit on an internal network;
# only the scanner (which must reach customer targets) gets an egress network.
# Error tracking (Sentry protocol) is OFF unless a DSN is set. One Sentry project per service:
# SENTRY_DSN_API (api + api-worker), SENTRY_DSN_SCANNER, SENTRY_DSN_WEB; SENTRY_DSN is only a
# fallback. api/api-worker have no internet, so they report through the `sentry-relay` service
# (profile "sentry"); scanner and web report directly. See docs/architecture.md §7.
# api-jobs (Arq: scheduled scans + alerts, docs/architecture.md §8.1) is the only Python service
# with egress, and only to send alerts (SMTP host from .env, Slack webhooks).

name: guardhub

x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://${GUARDHUB_APP_DB_USER:?}:${GUARDHUB_APP_DB_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?}
  DATA_ENCRYPTION_KEYS_PREVIOUS: ${DATA_ENCRYPTION_KEYS_PREVIOUS:-}
  HASH_PEPPER: ${HASH_PEPPER:?}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
  SCANNER_ALLOW_PRIVATE_HOSTS: ${SCANNER_ALLOW_PRIVATE_HOSTS:-}
  AI_PROVIDER: ${AI_PROVIDER:-}
  AI_API_KEY: ${AI_API_KEY:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Error tracking: off unless SENTRY_DSN_API (or the SENTRY_DSN fallback) is set. The DSN host
  # is replaced by the relay (key and project id kept): api/api-worker have no internet.
  SENTRY_DSN_API: ${SENTRY_DSN_API:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_RELAY_URL: ${SENTRY_RELAY_URL:-http://sentry-relay:3000}
  GUARDHUB_VERSION: ${GUARDHUB_VERSION:-local}
  # Alert e-mail (non-secret part; the API uses it to say whether e-mail alerts are set up).
  # Empty SMTP_HOST = e-mail alerts are skipped. Credentials go to api-jobs only.
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
  SMTP_INSECURE_HOSTS: ${SMTP_INSECURE_HOSTS:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      GUARDHUB_APP_DB_USER: ${GUARDHUB_APP_DB_USER:?}
      GUARDHUB_APP_DB_PASSWORD: ${GUARDHUB_APP_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/docker/postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: guardhub-api:${GUARDHUB_VERSION:-local}
    command: ["alembic", "-c", "/app/ops/migrations/alembic.ini", "upgrade", "head"]
    environment:
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      GUARDHUB_APP_DB_USER: ${GUARDHUB_APP_DB_USER:?}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]

  api:
    image: guardhub-api:${GUARDHUB_VERSION:-local}
    restart: unless-stopped
    environment: *api-env
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).status in (200,) else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [backend]

  api-worker:
    image: guardhub-api:${GUARDHUB_VERSION:-local}
    restart: unless-stopped
    command: ["python", "-m", "guardhub_api.worker"]
    environment: *api-env
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [backend]

  # Python-only background jobs (Arq): the 5-minute scan scheduler and change alerts. Same image
  # as api. On `egress` only to deliver alerts (SMTP, hooks.slack.com); everything else it talks
  # to (postgres, redis, sentry-relay) is on the internal backend network.
  api-jobs:
    image: guardhub-api:${GUARDHUB_VERSION:-local}
    restart: unless-stopped
    command: ["python", "-m", "guardhub_api.jobs"]
    environment:
      <<: *api-env
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SCHEDULER_BATCH: ${SCHEDULER_BATCH:-10}
      SCHEDULER_MAX_INFLIGHT: ${SCHEDULER_MAX_INFLIGHT:-2}
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [backend, egress]

  scanner:
    build: { context: ./apps/scanner }
    image: guardhub-scanner:${GUARDHUB_VERSION:-local}
    restart: unless-stopped
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
      SCANNER_WORKERS: ${SCANNER_WORKERS:-4}
      SCANNER_CHECK_CONCURRENCY: ${SCANNER_CHECK_CONCURRENCY:-3}
      SCANNER_HOST_RPS: ${SCANNER_HOST_RPS:-4}
      SCANNER_MAX_REQUESTS_PER_SCAN: ${SCANNER_MAX_REQUESTS_PER_SCAN:-160}
      SCANNER_REQUEST_TIMEOUT: ${SCANNER_REQUEST_TIMEOUT:-10s}
      SCANNER_ALLOW_PRIVATE_HOSTS: ${SCANNER_ALLOW_PRIVATE_HOSTS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN_SCANNER: ${SENTRY_DSN_SCANNER:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      GUARDHUB_VERSION: ${GUARDHUB_VERSION:-local}
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      redis: { condition: service_healthy }
    networks: [backend, egress]

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    image: guardhub-web:${GUARDHUB_VERSION:-local}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      SENTRY_DSN_WEB: ${SENTRY_DSN_WEB:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_BROWSER: ${SENTRY_BROWSER:-on}
      GUARDHUB_VERSION: ${GUARDHUB_VERSION:-local}
    read_only: true
    # Next.js writes its runtime caches under .next/cache; the root filesystem is read-only, so
    # that one directory is a small, capped, app-user-only tmpfs (uid/gid 1001 = guardhub).
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache:uid=1001,gid=1001,mode=0700,size=64m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      api: { condition: service_healthy }
    ports:
      # Loopback only by default: Docker-published ports bypass host firewalls (UFW). Put a
      # reverse proxy in front for public traffic (see docker-compose.prod.yml / the runbook).
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    networks: [backend, frontend]

  # Sentry Relay in proxy mode: the ONLY way api/api-worker reach the error-tracking server.
  # api and api-worker stay on the internal network; only the relay gets egress, and it only
  # forwards Sentry envelopes to the DSN's host. Enable with COMPOSE_PROFILES=sentry (in .env).
  sentry-relay:
    image: getsentry/relay:26.4.0
    profiles: [sentry]
    restart: unless-stopped
    # Upstream = scheme/host/port of the API DSN (e.g. https://o<org>.ingest.de.sentry.io for the EU
    # region); --upstream-dsn ignores its key and project. api and api-worker send via this relay.
    command: ["run", "--config", "/etc/relay", "--upstream-dsn", "${SENTRY_DSN_API:-${SENTRY_DSN:-}}"]
    volumes:
      - ./ops/docker/relay:/etc/relay:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [backend, egress]

networks:
  backend:
    internal: true # no internet access for postgres/redis/api
  frontend: {}
  egress: {}

volumes:
  pgdata: {}
  redisdata: {}
